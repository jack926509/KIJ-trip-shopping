<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小倉・博多・天神購物地圖｜北九州之旅</title>
  <meta name="description" content="北九州之旅的小倉、博多與天神購物地圖，可依區域、類別與關鍵字篩選。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2f6d5e">
  <script>
    window.__mapFallbackRequested = false;
    /* 兩條降級路徑的後果完全不同，訊息必須分開講：
     * - 圖磚載不到（tileerror）：Leaflet 有載到，map-app.js 整支照跑，
     *   店家清單、搜尋與篩選真的還能用。
     * - Leaflet 本身載不到：map-app.js 的主體整個包在 else 裡被跳過，
     *   清單、搜尋、篩選一個都不會渲染。這時再說「仍可正常使用」是騙人的，
     *   使用者會站在博多站盯著一個空白面板找不到店。 */
    function showMapFallback({ scriptMissing = false } = {}) {
      window.__mapFallbackRequested = true;
      const mapElement = document.getElementById('map');
      const fallbackElement = document.getElementById('mapFallback');
      if (mapElement) mapElement.hidden = true;
      if (fallbackElement) fallbackElement.hidden = false;
      const noteElement = document.getElementById('mapFallbackNote');
      const actionsElement = document.getElementById('mapFallbackActions');
      if (scriptMissing) {
        if (noteElement) noteElement.textContent = '地圖元件沒有下載成功，這一頁的店家清單、搜尋與篩選也無法使用。連上網路後重新整理，或先回購物清單——清單上的店家名同樣可以開 Google Maps。';
        if (actionsElement) actionsElement.hidden = false;
        /* 這些控制項的事件全在被跳過的那段裡，留在畫面上只是按了沒反應的假按鈕，
           比訊息本身更誤導。整組收掉，只留降級訊息與兩個真的能動的動作。 */
        for (const id of ['mapTopbar', 'locateBtn', 'drawer']) {
          const element = document.getElementById(id);
          if (element) element.hidden = true;
        }
      } else if (noteElement) {
        noteElement.textContent = '只有地圖圖磚載不到，店家清單、搜尋與篩選仍可正常使用；請從卡片開啟 Google Maps 導航或官方資料。';
      }
    }
  </script>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
    onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'"
  >
  <!-- 圖釘聚合套件的兩支樣式：MarkerCluster.css 是必要的定位樣式，
       Default.css 是套件預設的藍色圓圈外觀（本檔用 .map-cluster 覆寫成綠色系）。
       這兩支載不到不會讓頁面壞掉，聚合圓圈只是變成沒有樣式的方塊，
       真正的降級判斷在 initMap()：L.markerClusterGroup 不存在就退回 L.layerGroup。 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css'">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css'">
  <link rel="stylesheet" href="assets/kij.css">
  <style>
    /* 色票主檔是 assets/kij.css（index.html 也吃同一支）：
     * --bg / --surface / --accent / --accent-soft / --text / --muted / --line / --tap-min
     * 一律沿用，本檔不再重宣告一份。先前為了「避免掉回珊瑚橘」而手動對應 --accent
     * 的雙軌寫法已移除——共用色只留一個來源，底部導覽列與清單頁才不會再漂移。
     * 下面只留 kij.css 沒有、而地圖頁真的需要的補充變數。 */
    :root {
      --accent-dark: #1f5145;   /* 綠色的深色態（標題、按下狀態），kij.css 未定義 */
      --gold: #d8a414;          /* 店家備註左側標線，僅本頁使用 */
      /* 抽屜三段吸附點；--drawer-top-gap 由 JS 依浮動控制列實際高度覆寫 */
      --drawer-peek: 110px;
      --drawer-half: 46vh;
      --drawer-top-gap: 190px;
      /* 抽屜目前實際露出的高度，由 JS 隨吸附狀態與拖曳更新。
       * 地圖上的浮動元件（圖資出處、我在這、跨區 chip）都貼著它往上排，
       * 抽屜一拉高就跟著往上，永遠按得到、不會被抽屜蓋住。 */
      --drawer-visible: 110px;
    }

    * { box-sizing: border-box; }

    /* 現場模式：整頁是不捲動的 app shell，捲動只發生在抽屜內部。
     * 手指想捲清單卻拖到地圖的衝突，靠「頁面本身沒有捲軸」根治，不另外加手勢鎖。 */
    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    a { color: inherit; }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* 焦點樣式沿用 assets/kij.css 的 :focus-visible 規則，本檔不另訂一套 */

    /* app-shell 佔滿底部導覽列以外的所有空間；地圖與抽屜都定位在它裡面，
     * 抽屜因此永遠停在導覽列上方，卡片按鈕不會再被導覽列蓋住。 */
    .app-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      /* 抽屜是用 transform 往下推來收合的，被推出去的那一截仍算進頁面的可捲區域，
       * 不裁掉的話 body.scrollHeight 會比視窗高、頁面又出現捲軸，
       * 「整頁不捲動」這個前提就破了（手指想捲清單會再度拖到地圖）。 */
      overflow: hidden;
    }

    .map-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #e8ece8;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8ece8;
    }

    .map-attribution {
      position: absolute;
      right: 9px;
      /* 手機版抽屜停在畫面底部，圖資出處要往上讓開才不會被蓋掉。
       * min() 的第二項是「抽屜完全展開時的高度」，確保再怎麼拉都不會被推出地圖外。 */
      bottom: min(calc(var(--drawer-visible) + 6px), calc(100% - var(--drawer-top-gap)));
      z-index: 500;
      padding: 3px 6px;
      background: rgba(255, 255, 255, .9);
      border-radius: 4px;
      color: #385e52;
      font-size: 11px;
      line-height: 1.3;
    }

    .map-attribution a { color: inherit; }
    #map[hidden] + .map-attribution { display: none; }

    #mapFallback {
      position: absolute;
      inset: 0;
      z-index: 400;
      display: grid;
      place-content: center;
      padding: 40px 24px;
      overflow: auto;
      background: linear-gradient(145deg, var(--accent-soft), #f7f4ed);
      text-align: center;
    }

    /* class 選擇器的 display 會蓋過 [hidden] 的瀏覽器預設樣式，
       同 .filter-group[hidden] 早先修過的問題，這三個容器也要各補一條。 */
    .map-topbar[hidden], .drawer[hidden], .map-tool-btn[hidden] { display: none; }

    .fallback-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }
    .fallback-actions[hidden] { display: none; }
    .fallback-actions button,
    .fallback-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-min);
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: #fff;
      color: var(--accent);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .fallback-actions button { background: var(--accent); border-color: var(--accent); color: #fff; }

    #mapFallback[hidden],
    #map[hidden] { display: none; }

    .fallback-icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      font-size: 28px;
      box-shadow: 0 8px 22px rgba(55, 48, 39, .08);
    }

    #mapFallback h2 { margin: 0 0 8px; font-size: 22px; }

    #mapFallback p {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* ── 浮在地圖上的控制列（搜尋＋區域＋分類）──────────────────
     * 桌機版由 JS 搬進左側面板（見 syncLayout），手機版留在地圖上。 */
    .map-topbar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 700;
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(250, 249, 246, .94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(55, 48, 39, .12);
      backdrop-filter: blur(12px);
    }

    .map-search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--tap-min);
      padding: 0 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .map-search-icon { flex: 0 0 auto; font-size: 14px; }

    .map-search input {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      outline: none;
      /* Safari 的 search 型別預設會畫一顆自己的清除鈕，與本檔的清除鈕重複 */
      -webkit-appearance: none;
      appearance: none;
    }

    .map-search input::-webkit-search-cancel-button { display: none; }
    .map-search input::placeholder { color: #a49b91; }

    .map-search-clear {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-dark);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .map-search-clear[hidden] { display: none; }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-group::-webkit-scrollbar { display: none; }

    .filter-label {
      flex: 0 0 auto;
      width: 38px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .filter-group button {
      flex: 0 0 auto;
      /* 手指按得到：手機轉橫（寬 844px）時不會落回 38px */
      min-height: var(--tap-min);
      padding: 7px 13px;
      border: 0;
      border-radius: 999px;
      background: #ece8e1;
      color: #4e5652;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .filter-group button:hover { background: #e1ddd5; }

    .filter-group button.active {
      background: var(--accent);
      color: #fff;
    }

    /* 手機版預設只留「搜尋框＋區域一排」，分類八顆 chips 收在這顆按鈕後面，
     * 控制列高度從三排壓成兩排（實測 ≤200px），地圖才有畫面可看。
     * 桌機版控制列在左側面板裡，空間夠，這顆按鈕由 syncLayout() 隱藏、分類永遠展開。 */
    .map-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .map-filter-row .filter-group { flex: 1 1 auto; min-width: 0; }

    .filter-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: var(--tap-min);
      padding: 7px 12px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: #fff;
      color: var(--accent-dark);
      cursor: pointer;
      font: inherit;
      font-size: 12.5px;
      font-weight: 850;
      white-space: nowrap;
    }

    .filter-toggle:hover { background: var(--accent-soft); }
    .filter-toggle[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-toggle[hidden] { display: none; }

    /* 區域這一排可能超出寬度，右緣做漸層淡出＋一顆「›」提示「還可以往右滑」，
     * 不然使用者只會以為區域就到眼前這幾顆為止。
     * 分類那一排改成展開後換行（見 #storeTypeFilter），圖例也改成換行，
     * 兩者都不會再出現「超市」被切一半卻看不出可捲的情形。 */
    .filter-group.is-scrollable {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
    }

    .scroll-hint {
      display: none;
      flex: 0 0 auto;
      align-self: center;
      margin-left: -4px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
      pointer-events: none;
    }

    .filter-group.is-scrollable + .scroll-hint { display: block; }

    /* 分類 chips 展開後換行呈現，八個分類一次看完，不必左右滑也不會被切邊 */
    #storeTypeFilter {
      flex-wrap: wrap;
      overflow-x: visible;
    }

    /* .filter-group 的 display:flex 是 class 選擇器，優先權高過 [hidden] 的瀏覽器預設樣式，
     * 少了這一條，JS 設 hidden 會完全沒有作用（分類列永遠攤開，控制列高度多出 144px）。 */
    .filter-group[hidden] { display: none; }

    /* ── 地圖上的浮動工具（我在這）與跨區提示 chip ───────────── */
    .map-tools {
      position: absolute;
      right: 12px;
      bottom: min(calc(var(--drawer-visible) + 40px), calc(100% - var(--drawer-top-gap) - 52px));
      z-index: 690;
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .map-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: var(--tap-min);
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .95);
      color: var(--accent-dark);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 6px 18px rgba(55, 48, 39, .16);
    }

    .map-tool-btn:hover { background: var(--accent-soft); }
    .map-tool-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .map-tool-btn[disabled] { opacity: .6; cursor: progress; }
    .map-tool-btn[hidden] { display: none; }

    /* 路線模式時地圖上一定要有一條明顯的出口，不必先把抽屜拉開才找得到 */
    .map-tool-btn.route-exit-map {
      background: #b23a48;
      border-color: #b23a48;
      color: #fff;
    }

    .map-tool-btn.route-exit-map:hover { background: #8f2c38; }

    /* 取代舊的「請按上方小倉」文字：畫面外還有店家的區域，直接在地圖上給一顆可點的 chip。
     * 兩區以上時先合併成一顆「其他區域 N 區 M 家 ›」，點開才展開個別區域——
     * 舊版兩顆 chip 疊成兩排，抽屜拉到 half 時會擠到地圖中間。
     * 不換行（nowrap）並貼齊地圖底緣，永遠只佔一列高度。 */
    .map-area-chips {
      position: absolute;
      left: 12px;
      bottom: min(calc(var(--drawer-visible) + 10px), calc(100% - var(--drawer-top-gap) - 52px));
      z-index: 690;
      /* column-reverse：DOM 是「摘要 chip → 展開的區域清單」，畫面上展開的清單會往上長，
       * 貼著地圖下緣的摘要 chip 不會被推走，也不會撞到底部的抽屜。 */
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 6px;
      max-width: calc(100% - 150px);
    }

    .map-area-chip-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    /* 同 .filter-group[hidden]：class 的 display 會蓋掉 [hidden] 的瀏覽器預設樣式，
     * 少了這一條，摘要 chip 點開前個別區域就已經全部攤在地圖上了。 */
    .map-area-chip-group[hidden] { display: none; }

    .map-area-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: var(--tap-min);
      padding: 8px 14px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 6px 18px rgba(31, 81, 69, .3);
    }

    .map-area-chip:hover { background: var(--accent-dark); }

    /* 展開個別區域後的「收起」，用低調樣式，不跟真正要按的區域搶注意力 */
    .map-area-chip--collapse {
      background: rgba(255, 255, 255, .95);
      border: 1px solid var(--line);
      color: var(--accent-dark);
      box-shadow: 0 6px 18px rgba(55, 48, 39, .16);
    }

    .map-area-chip--collapse:hover { background: var(--accent-soft); }

    /* ── 可拖曳抽屜 ───────────────────────────────────────────
     * 三段吸附：peek（只露把手與摘要）／half／full。
     * 把手是 <button>，點一下循環切換，鍵盤 Enter／Space 同樣可用，
     * 拖曳只是額外的手勢捷徑，不是唯一操作路徑。 */
    .drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 800;
      height: calc(100% - var(--drawer-top-gap));
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -12px 34px rgba(55, 48, 39, .18);
      will-change: transform;
    }

    /* 三段吸附的位移只在手機生效，而且必須整組關在 max-width 裡：
     * @media 本身不加權重，.drawer[data-state="half"]（0,2,0）會壓過
     * 桌機區塊裡的 .drawer { transform: none }（0,1,0），左側面板就會被推下去半屏。 */
    @media (max-width: 820px) {
      .drawer {
        transform: translateY(calc(100% - var(--drawer-peek)));
        transition: transform .28s cubic-bezier(.32, .72, 0, 1);
      }

      .drawer[data-state="half"] { transform: translateY(calc(100% - var(--drawer-half))); }
      .drawer[data-state="full"] { transform: translateY(0); }
      .drawer.is-dragging { transition: none; }
    }

    /* Leaflet 的縮放控制改掛右上（見 initMap）：左上會壓到跨區 chip，
     * 上緣還要讓開浮動控制列的高度，否則整組藏在控制列底下按不到。 */
    .leaflet-top.leaflet-right { top: var(--drawer-top-gap); }

    .drawer-handle {
      flex: 0 0 auto;
      display: grid;
      justify-items: center;
      gap: 4px;
      width: 100%;
      min-height: 56px;
      padding: 8px 16px 10px;
      border: 0;
      border-radius: 22px 22px 0 0;
      background: transparent;
      color: var(--accent-dark);
      cursor: grab;
      font: inherit;
      /* 把手上的手勢由 pointer 事件全權處理，交給瀏覽器捲動會與拖曳打架 */
      touch-action: none;
    }

    .drawer-handle:active { cursor: grabbing; }

    .drawer-grip {
      display: block;
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: #d8d2c8;
    }

    .drawer-handle-text {
      font-size: 13px;
      font-weight: 850;
    }

    .drawer-scroll {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
      /* 抽屜捲到底不把捲動傳給地圖／頁面 */
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-color: #c9c3b8 transparent;
      scrollbar-width: thin;
    }

    /* peek 時內容只是背景，不該能捲，否則手指一滑就把清單捲走卻看不到 */
    .drawer[data-state="peek"] .drawer-scroll { overflow-y: hidden; }

    /* 桌機版才會被 JS 塞進控制列，手機版是空的，不佔高度 */
    .drawer-dock:empty { display: none; }

    .hero { margin: 0 0 12px; }
    .drawer-scroll .geo-notice { margin-top: 4px; }

    /* 抽屜收在 peek 時，把手底下唯一看得到的那一行。
     * 舊版這裡是頁面大標題，佔滿 peek 卻沒有任何一家店的資訊；
     * 現在改成「有定位就報最近的一家店，沒定位就講清楚往上滑會拿到什麼」。
     * 大標題與說明已移到抽屜最底下的 .about-section。 */
    .peek-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0 10px;
      padding: 9px 12px;
      background: var(--accent-soft);
      border-radius: 12px;
      color: var(--accent-dark);
      font-size: 12.5px;
      font-weight: 750;
      line-height: 1.5;
    }

    /* 只在 peek 露出：抽屜一拉開就讓位給店家卡，不再多佔一行 */
    .drawer:not([data-state="peek"]) .peek-summary { display: none; }

    /* 頁面大標題、「關於這份地圖」與圖例移到抽屜最後：
     * 拉開抽屜第一眼看到的是店家卡與路線分頁，不是要滑很久才過得去的頁首。
     * 內容一字未刪，只是換了位置。 */
    .about-section {
      margin: 24px 0 0;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 4vw, 28px);
      letter-spacing: -.025em;
      line-height: 1.2;
    }

    .hero-note { margin-top: 4px; }

    .hero-note summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: var(--tap-min);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .hero-note summary::-webkit-details-marker { display: none; }

    .hero-note summary::after {
      content: "▾";
      font-size: 11px;
    }

    .hero-note[open] summary::after { content: "▴"; }

    .hero-copy {
      max-width: 760px;
      margin: 2px 0 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    /* 定位失敗時的白話說明；不用 alert、不自動重試 */
    .geo-notice {
      margin: 0 0 12px;
      padding: 10px 12px;
      background: #fdf6e6;
      border: 1px solid #eddcb2;
      border-radius: 12px;
      color: #6b5a2c;
      font-size: 12.5px;
      line-height: 1.65;
    }

    .geo-notice[hidden] { display: none; }

    .result-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-line strong { color: var(--accent); }

    .sort-distance-btn {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--accent-dark);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 850;
    }

    .sort-distance-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sort-distance-btn[hidden] { display: none; }

    /* 圖例改成換行：舊版橫向可捲但看不出來，最後一顆（超市）常被切一半 */
    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      width: 100%;
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票。
     * 每一色必須與下方對應的 .map-pin--* 相同，否則圖例會與地圖上的標記對不起來；
     * 七個分類要全部列出，漏掉任何一個該色點會變成透明（看起來像沒有圖例）。 */
    .legend .shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .legend .drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .legend .daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .legend .supermarket { background: #a04a10; } /* 對應 .kij-cat-food */
    .legend .convenience { background: #b23a48; }
    .legend .electronics { background: #6552a4; }
    .legend .gift-food { background: #8b6500; }
    .legend .clothing { background: #5a6b2f; }

    /* 路線模式的編號 marker：沿用分類色系，白色粗體數字，聚合在路線模式下關閉，
     * 所以這些編號不會被聚合圓圈吃掉。 */
    .route-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(38, 48, 44, .38);
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* 與 .map-pin--* 同一組色碼，手動保持一致 */
    .route-pin--shoe { background: #1f5fa8; }
    .route-pin--drug { background: #0a7a6a; }
    .route-pin--daily { background: #a04a10; }
    .route-pin--supermarket { background: #a04a10; }
    .route-pin--convenience { background: #b23a48; }
    .route-pin--electronics { background: #6552a4; }
    .route-pin--gift-food { background: #8b6500; }
    .route-pin--clothing { background: #5a6b2f; }

    /* 起點（車站錨點）要一眼分得出來：金色外框＋「起」字 */
    .route-start-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--accent-dark);
      border: 3px solid var(--gold);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(31, 81, 69, .45);
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
    }

    .popup-step {
      display: block;
      margin-bottom: 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
    }

    #storeList {
      display: grid;
      gap: 12px;
    }

    .store-card {
      padding: 17px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 19px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .055);
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }

    .store-card:hover,
    .store-card.is-focused {
      transform: translateY(-2px);
      border-color: rgba(47, 109, 94, .55);
      box-shadow: 0 12px 28px rgba(55, 48, 39, .10);
    }

    .store-card.is-focused {
      border-width: 2px;
      border-color: var(--accent);
      background: linear-gradient(135deg, #ffffff, #f0f7f4);
    }

    .store-focus {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .area-tag { background: var(--accent-soft); color: var(--accent); }
    .category-tag { background: #f2eee8; color: #665e54; }
    .category-convenience { background: #fff1f1; color: #b23a48; }
    .category-electronics { background: #f0edff; color: #6552a4; }
    .category-gift-food { background: #fff7dd; color: #8b6500; }
    .category-shoe { background: #e7f0ff; color: #28639d; }
    .category-drug { background: #e7f6f2; color: #0a7a6a; }
    .category-daily { background: #fff2df; color: #a55b09; }
    .category-supermarket { background: #fff0e7; color: #a04a10; }
    .category-clothing { background: #f1f5e4; color: #5a6b2f; }

    .store-name {
      display: block;
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.012em;
      line-height: 1.4;
    }

    .brand {
      margin: 3px 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    /* 「我在這」定位成功後才出現的距離列；文案一律講明是直線估算 */
    .store-distance {
      display: block;
      margin: 0 0 10px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .details {
      display: grid;
      gap: 7px;
      margin: 0;
    }

    .details div {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 8px;
      font-size: 13px;
      line-height: 1.55;
    }

    .details dt { color: var(--muted); }
    .details dd { margin: 0; font-weight: 650; }

    .note {
      margin: 13px 0 0;
      padding: 10px 12px;
      background: #faf8f4;
      border-left: 3px solid var(--gold);
      border-radius: 9px;
      color: #625a51;
      font-size: 12px;
      line-height: 1.65;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* 「Google Maps 導航」是站在店門口最常按的連結，維持在手指按得到的尺寸 */
      min-height: var(--tap-min);
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .action-link:hover { background: var(--accent-soft); }

    .maps-link {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .maps-link:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

    .store-products {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .store-products-label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 850;
    }

    .store-products-thumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .store-product-thumb {
      display: block;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .store-product-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 已在清單頁勾選「已購買」的商品在這裡淡出，一眼看出還有哪幾項要買 */
    .store-product-thumb.is-bought {
      opacity: .38;
      filter: grayscale(1);
    }

    .store-products-more {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    #emptyState {
      padding: 40px 20px;
      background: #fff;
      border: 1px dashed #ccc4b9;
      border-radius: 19px;
      color: var(--muted);
      text-align: center;
    }

    #emptyState[hidden] { display: none; }
    #emptyState strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }

    #resetFiltersBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-min);
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: #fff;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }

    #resetFiltersBtn:hover { background: var(--accent-soft); }

    .leaflet-container { font: inherit; }

    .map-pin {
      display: block;
      width: 28px;
      height: 28px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 8px;
      box-shadow: 0 4px 12px rgba(38, 48, 44, .3);
      transform: rotate(-45deg);
    }

    .map-pin span {
      display: block;
      width: 8px;
      height: 8px;
      margin: 7px;
      background: #fff;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票 */
    .map-pin--shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .map-pin--drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .map-pin--daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .map-pin--supermarket { background: #a04a10; } /* 對應 .kij-cat-food */
    .map-pin--convenience { background: #b23a48; }
    .map-pin--electronics { background: #6552a4; }
    .map-pin--gift-food { background: #8b6500; }
    .map-pin--clothing { background: #5a6b2f; }

    /* 聚合圓圈：覆寫 MarkerCluster.Default.css 的預設藍色，改用本站綠色系。
     * 套件會把 .marker-cluster 這層留著，所以要一併把它的背景清掉。 */
    .leaflet-marker-icon.marker-cluster,
    .leaflet-marker-icon.marker-cluster div {
      background: none;
      border-radius: 0;
    }

    .map-cluster {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: var(--accent);
      border: 3px solid rgba(255, 255, 255, .92);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(31, 81, 69, .38);
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      line-height: 1;
    }

    .map-cluster--lg { font-size: 15px; }

    /* 使用者位置：自訂樣式，不用 Leaflet 預設的圖片標記 */
    .user-dot {
      display: block;
      width: 18px;
      height: 18px;
      background: #1f6fd4;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(31, 111, 212, .22), 0 3px 10px rgba(20, 40, 70, .35);
    }

    .popup-content { min-width: 180px; }
    .popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .popup-content span { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .popup-content .popup-count { display: block; margin-top: 5px; color: var(--accent-dark); font-weight: 850; }
    .popup-content .popup-distance { display: block; margin-top: 5px; color: var(--accent-dark); font-weight: 800; }

    /* ── 桌機：左面板 ＋ 右地圖，抽屜行為只在手機生效 ───────── */
    @media (min-width: 821px) {
      .app-shell { display: flex; }

      .map-stage {
        position: relative;
        inset: auto;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }

      .drawer {
        position: relative;
        order: -1;
        flex: 0 0 clamp(420px, 30vw, 460px);
        width: clamp(420px, 30vw, 460px);
        height: 100%;
        border-top: 0;
        border-right: 1px solid var(--line);
        border-radius: 0;
        box-shadow: 6px 0 22px rgba(55, 48, 39, .07);
        /* 位移規則已關在 max-width: 820px 裡，這裡不必再覆寫 transform */
      }

      .leaflet-top.leaflet-right { top: 0; }
      .drawer-handle { display: none; }
      .drawer[data-state="peek"] .drawer-scroll { overflow-y: auto; }
      .drawer-scroll { padding: 18px 18px 28px; }

      /* 控制列被 JS 搬進面板後改為一般流排版，不再浮在地圖上 */
      .drawer-dock .map-topbar {
        position: static;
        margin: 0 0 14px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
      }

      .drawer-dock .map-search { background: #fff; }

      /* 圖資出處在右下角，「我在這」再往上讓一點才不會壓在它上面 */
      .map-tools { bottom: 34px; }
      .map-area-chips { bottom: 16px; }
      .map-attribution { bottom: 8px; }
      .map-area-chips { max-width: calc(100% - 200px); }

      /* 桌機左側面板空間夠，peek 這一行沒有意義（抽屜不會收合） */
      .peek-summary { display: none; }
    }

    @media (max-width: 540px) {
      .map-topbar { left: 8px; right: 8px; padding: 9px 10px; gap: 7px; border-radius: 15px; }
      .filter-label { width: 34px; font-size: 11px; }
      .filter-group { gap: 6px; }
      .filter-group button { padding: 7px 12px; }
      .drawer-scroll { padding-left: 13px; padding-right: 13px; }
      .store-card { padding: 15px; }
      .details div { grid-template-columns: 58px minmax(0, 1fr); }
      .filter-toggle { padding: 7px 10px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      .drawer { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="map-stage" id="mapStage" aria-label="店家地圖">
      <div id="map"></div>
      <div class="map-attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors</div>
      <div id="mapFallback" hidden>
        <div class="fallback-icon" aria-hidden="true">⌖</div>
        <h2>地圖暫時無法載入</h2>
        <p id="mapFallbackNote">店家清單、搜尋與篩選仍可正常使用；請從卡片開啟 Google Maps 導航或官方資料。</p>
        <div class="fallback-actions" id="mapFallbackActions" hidden>
          <button type="button" onclick="location.reload()">重新整理</button>
          <a href="index.html">回購物清單</a>
        </div>
      </div>

      <!-- 浮在地圖上的控制列。桌機版由 syncLayout() 搬進左側面板的 #drawerDock。 -->
      <div class="map-topbar" id="mapTopbar">
        <div class="map-search">
          <span class="map-search-icon" aria-hidden="true">🔍</span>
          <input
            id="storeSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="搜尋店名、品牌或想買的東西"
            aria-label="搜尋店家或商品，例如：行動電源"
          >
          <button type="button" class="map-search-clear" id="storeSearchClear" aria-label="清除搜尋" hidden>✕</button>
        </div>
        <!-- 手機版控制列預設只有這兩排（搜尋＋區域），分類收在「分類」按鈕後面，
             展開才佔第三排；桌機版由 syncLayout() 隱藏按鈕、分類永遠展開。 -->
        <div class="map-filter-row">
          <div class="filter-group" aria-label="區域篩選">
            <span class="filter-label">區域</span>
            <!-- 區域順序與購物路線的 ROUTE_AREA_ORDER 一致（天神→博多→小倉），
                 同一頁兩處若一個由南往北、一個由北往南會互相打架。 -->
            <button class="active" type="button" data-area="all" aria-pressed="true">全部</button>
            <button type="button" data-area="tenjin" aria-pressed="false">天神</button>
            <button type="button" data-area="hakata" aria-pressed="false">博多</button>
            <button type="button" data-area="kokura" aria-pressed="false">小倉</button>
          </div>
          <span class="scroll-hint" aria-hidden="true">›</span>
          <button
            type="button"
            class="filter-toggle"
            id="categoryToggle"
            aria-expanded="false"
            aria-controls="storeTypeFilter"
          >分類 ▾</button>
        </div>
        <!-- 分類由原生 <select> 改成 pill 按鈕：與區域列同一種操作方式，
             手機上一按就切換，不必先開下拉再捲動選單。 -->
        <div class="filter-group" id="storeTypeFilter" aria-label="店家分類篩選" hidden>
          <span class="filter-label">店家</span>
          <button class="active" type="button" data-category="all" aria-pressed="true">全部</button>
          <button type="button" data-category="shoe" aria-pressed="false">鞋店</button>
          <button type="button" data-category="drug" aria-pressed="false">藥妝</button>
          <button type="button" data-category="daily" aria-pressed="false">生活雜貨</button>
          <button type="button" data-category="supermarket" aria-pressed="false">超市</button>
          <button type="button" data-category="convenience" aria-pressed="false">便利商店</button>
          <button type="button" data-category="electronics" aria-pressed="false">家電</button>
          <button type="button" data-category="gift-food" aria-pressed="false">食品伴手禮</button>
          <button type="button" data-category="clothing" aria-pressed="false">服飾用品</button>
        </div>
      </div>

      <div class="map-tools">
        <!-- 路線模式的出口之一（另一個在抽屜的行程上方），地圖上一定要看得到 -->
        <button type="button" class="map-tool-btn route-exit-map" id="routeExitMapBtn" hidden>✕ 結束路線</button>
        <button type="button" class="map-tool-btn" id="locateBtn">◎ 我在這</button>
      </div>

      <!-- 取代舊的「請按上方小倉」文字提示：畫面外還有店家的區域直接給可點的 chip -->
      <div class="map-area-chips" id="mapAreaChips" aria-label="其他區域的店家"></div>
    </section>

    <aside class="drawer" id="drawer" data-state="peek" aria-label="店家清單">
      <button
        type="button"
        class="drawer-handle"
        id="drawerHandle"
        aria-controls="drawerScroll"
        aria-expanded="false"
      >
        <span class="drawer-grip" aria-hidden="true"></span>
        <span class="drawer-handle-text" id="drawerHandleText">店家清單</span>
      </button>

      <div class="drawer-scroll" id="drawerScroll">
        <!-- 抽屜收著時唯一露出來的一行，內容由 renderStores() 依有沒有定位填入 -->
        <p class="peek-summary" id="peekSummary"></p>

        <p class="geo-notice" id="geoNotice" role="status" hidden></p>

        <!-- 桌機版控制列的插槽；手機版留空（:empty 不佔高度） -->
        <div class="drawer-dock" id="drawerDock"></div>

        <div class="result-line">
          <span id="resultCount" aria-live="polite"></span>
          <button type="button" class="sort-distance-btn" id="sortDistanceBtn" aria-pressed="false" hidden>依距離排序</button>
        </div>

        <div id="storeList"></div>
        <div id="emptyState" hidden>
          <strong>沒有符合條件的店家</strong>
          請調整搜尋關鍵字、區域或類別篩選。
          <div>
            <button type="button" id="resetFiltersBtn">重設篩選</button>
          </div>
        </div>

        <!-- 標題、說明與圖例移到最後：抽屜一拉開先看到的是店家卡與路線，
             不必滑過一整屏頁首。內容一字未改，只是換了位置。 -->
        <section class="about-section">
          <header class="hero">
            <p class="eyebrow">KOKURA · HAKATA · TENJIN</p>
            <h1>小倉・博多・天神購物地圖</h1>
            <!-- 說明維持預設收合，內容一字未改，只是從頁首搬進抽屜。 -->
            <details class="hero-note">
              <summary>關於這份地圖</summary>
              <p class="hero-copy">依區域與類別快速找順路店家。地圖座標供初步定位，實際出發前請以官方資料確認營業時間，並使用 Google Maps 完整搜尋結果導航。</p>
            </details>
          </header>
          <div class="legend" aria-label="地圖標記圖例">
            <span><i class="shoe"></i>鞋款</span>
            <span><i class="drug"></i>藥妝</span>
            <span><i class="daily"></i>生活雜貨</span>
            <span><i class="supermarket"></i>超市</span>
            <span><i class="convenience"></i>便利商店</span>
            <span><i class="electronics"></i>家電</span>
            <span><i class="gift-food"></i>食品伴手禮</span>
            <span><i class="clothing"></i>服飾用品</span>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <nav class="kij-bottombar" aria-label="主要導覽">
    <a href="index.html"><i>🛍️</i>清單</a>
    <a href="itinerary.html"><i>🗓️</i>行程</a>
    <a href="map.html" class="active" aria-current="page"><i>🗺️</i>地圖</a>
  </nav>

  <script>
    function loadMapDependency(urls, ready) {
      return new Promise((resolve) => {
        const loadAt = (index) => {
          if (ready()) return resolve(true);
          if (index >= urls.length) return resolve(false);
          const script = document.createElement('script');
          script.src = urls[index];
          script.crossOrigin = 'anonymous';
          script.onload = () => (ready() ? resolve(true) : loadAt(index + 1));
          script.onerror = () => loadAt(index + 1);
          document.head.append(script);
        };
        loadAt(0);
      });
    }

    window.__leafletReady = loadMapDependency([
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
      'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'
    ], () => typeof window.L !== 'undefined');

    window.__markerClusterReady = window.__leafletReady.then((leafletLoaded) => {
      if (!leafletLoaded) return false;
      return loadMapDependency([
        'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js'
      ], () => typeof window.L?.markerClusterGroup === 'function');
    });
  </script>
  <script type="module" src="scripts/map-app.js"></script>
</body>
</html>
