<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小倉・博多・天神購物地圖｜北九州之旅</title>
  <meta name="description" content="北九州之旅的小倉、博多與天神購物地圖，可依區域、類別與關鍵字篩選。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2f6d5e">
  <script>
    window.__mapFallbackRequested = false;
    /* 兩條降級路徑（圖磚載不到、Leaflet 本身載不到）現在後果一致：
     * map-app.js 不再把主體包在 else 裡，沒有 Leaflet 就只是不畫地圖，
     * 店家清單、搜尋、篩選與 Google Maps 導航照常運作。
     * 這句話因此在兩種情況下都是真的。 */
    function showMapFallback() {
      window.__mapFallbackRequested = true;
      const mapElement = document.getElementById('map');
      const fallbackElement = document.getElementById('mapFallback');
      if (mapElement) mapElement.hidden = true;
      if (fallbackElement) fallbackElement.hidden = false;
    }
  </script>
  <!-- Leaflet 與圖釘聚合套件改為自帶（assets/vendor/），不再走 unpkg／cdnjs。
       原因是這個網站要在日本的店裡用：CDN 走的是境外連線，訊號差的地下街最先斷的就是它，
       而 service worker 只能快取同源資產——掛在 CDN 上就等於地圖永遠離線不了。
       自帶之後也不需要 SRI：檔案同源、跟著本站一起部署，沒有第三方可以替換內容。
       版本鎖在 leaflet 1.9.4 與 leaflet.markercluster 1.5.3，位元組與原本 CDN 載到的完全相同
       （npm dist 的 leaflet.css 雜湊與先前釘在這裡的 SRI sha256-p4NxAoJ… 相符）。
       升級方式：npm pack leaflet@<版本> 後覆蓋 assets/vendor/，並更新 sw.js 的 CACHE_VERSION。

       MarkerCluster.css 是必要的定位樣式，Default.css 是套件預設的藍色圓圈外觀
       （本檔用 .map-cluster 覆寫成綠色系）。這兩支載不到不會讓頁面壞掉，
       真正的降級判斷在 initMap()：L.markerClusterGroup 不存在就退回 L.layerGroup。 -->
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css?v=20260902.1">
  <link rel="stylesheet" href="assets/vendor/leaflet.markercluster/MarkerCluster.css?v=20260902.1">
  <link rel="stylesheet" href="assets/vendor/leaflet.markercluster/MarkerCluster.Default.css?v=20260902.1">
  <link rel="stylesheet" href="assets/kij.css?v=20260902.1">
  <link rel="stylesheet" href="assets/map.css?v=20260902.1">
</head>
<body>
  <div class="app-shell">
    <section class="map-stage" id="mapStage" aria-label="店家地圖">
      <div id="map"></div>
      <div class="map-attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors</div>
      <div id="mapFallback" hidden>
        <div class="fallback-icon" aria-hidden="true">⌖</div>
        <h2>地圖暫時無法載入</h2>
        <p>下方店家清單、搜尋與篩選仍可正常使用；請從卡片開啟 Google Maps 導航或官方資料。</p>
        <div class="fallback-actions">
          <button type="button" onclick="location.reload()">重新整理</button>
        </div>
      </div>

      <!-- 浮在地圖上的控制列。桌機版由 syncLayout() 搬進左側面板的 #drawerDock。 -->
      <div class="map-topbar" id="mapTopbar">
        <div class="map-search">
          <span class="map-search-icon" aria-hidden="true">🔍</span>
          <input
            id="storeSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="搜尋店名、品牌或想買的東西"
            aria-label="搜尋店家或商品，例如：行動電源"
          >
          <button type="button" class="map-search-clear" id="storeSearchClear" aria-label="清除搜尋" hidden>✕</button>
        </div>
        <!-- 手機版控制列預設只有這兩排（搜尋＋區域），分類收在「分類」按鈕後面，
             展開才佔第三排；桌機版由 syncLayout() 隱藏按鈕、分類永遠展開。 -->
        <div class="map-filter-row">
          <div class="filter-group" aria-label="區域篩選">
            <span class="filter-label">區域</span>
            <!-- 區域順序與購物路線的 ROUTE_AREA_ORDER 一致（天神→博多→小倉），
                 同一頁兩處若一個由南往北、一個由北往南會互相打架。 -->
            <button class="active" type="button" data-area="all" aria-pressed="true">全部</button>
            <button type="button" data-area="tenjin" aria-pressed="false">天神</button>
            <button type="button" data-area="hakata" aria-pressed="false">博多</button>
            <button type="button" data-area="kokura" aria-pressed="false">小倉</button>
          </div>
          <span class="scroll-hint" aria-hidden="true">›</span>
          <button
            type="button"
            class="filter-toggle"
            id="categoryToggle"
            aria-expanded="false"
            aria-controls="storeTypeFilter"
          >分類 ▾</button>
        </div>
        <!-- 分類由原生 <select> 改成 pill 按鈕：與區域列同一種操作方式，
             手機上一按就切換，不必先開下拉再捲動選單。 -->
        <div class="filter-group" id="storeTypeFilter" aria-label="店家分類篩選" hidden>
          <span class="filter-label">店家</span>
          <button class="active" type="button" data-category="all" aria-pressed="true">全部</button>
          <button type="button" data-category="shoe" aria-pressed="false">鞋店</button>
          <button type="button" data-category="drug" aria-pressed="false">藥妝</button>
          <button type="button" data-category="daily" aria-pressed="false">生活雜貨</button>
          <button type="button" data-category="supermarket" aria-pressed="false">超市</button>
          <button type="button" data-category="convenience" aria-pressed="false">便利商店</button>
          <button type="button" data-category="electronics" aria-pressed="false">家電</button>
          <button type="button" data-category="gift-food" aria-pressed="false">食品伴手禮</button>
          <button type="button" data-category="clothing" aria-pressed="false">服飾用品</button>
        </div>
      </div>

      <div class="map-tools">
        <!-- 路線模式的出口之一（另一個在抽屜的行程上方），地圖上一定要看得到 -->
        <button type="button" class="map-tool-btn route-exit-map" id="routeExitMapBtn" hidden>✕ 結束路線</button>
        <button type="button" class="map-tool-btn" id="locateBtn">◎ 我在這</button>
      </div>

      <!-- 取代舊的「請按上方小倉」文字提示：畫面外還有店家的區域直接給可點的 chip -->
      <div class="map-area-chips" id="mapAreaChips" aria-label="其他區域的店家"></div>
    </section>

    <aside class="drawer" id="drawer" data-state="peek" aria-label="店家清單">
      <button
        type="button"
        class="drawer-handle"
        id="drawerHandle"
        aria-controls="drawerScroll"
        aria-expanded="false"
      >
        <span class="drawer-grip" aria-hidden="true"></span>
        <span class="drawer-handle-text" id="drawerHandleText">店家清單</span>
      </button>

      <div class="drawer-scroll" id="drawerScroll">
        <!-- 抽屜收著時唯一露出來的一行，內容由 renderStores() 依有沒有定位填入 -->
        <p class="peek-summary" id="peekSummary"></p>

        <p class="geo-notice" id="geoNotice" role="status" hidden></p>

        <p class="route-context" id="routeContext" role="status" hidden></p>

        <!-- 桌機版控制列的插槽；手機版留空（:empty 不佔高度） -->
        <div class="drawer-dock" id="drawerDock"></div>

        <div class="result-line">
          <span id="resultCount" aria-live="polite"></span>
          <button type="button" class="sort-distance-btn" id="sortDistanceBtn" aria-pressed="false" hidden>依距離排序</button>
        </div>

        <div id="storeList"></div>
        <div id="emptyState" hidden>
          <strong>沒有符合條件的店家</strong>
          請調整搜尋關鍵字、區域或類別篩選。
          <div>
            <button type="button" id="resetFiltersBtn">重設篩選</button>
          </div>
        </div>

        <!-- 標題、說明與圖例移到最後：抽屜一拉開先看到的是店家卡與路線，
             不必滑過一整屏頁首。內容一字未改，只是換了位置。 -->
        <section class="about-section">
          <header class="hero">
            <p class="eyebrow">KOKURA · HAKATA · TENJIN</p>
            <h1>小倉・博多・天神購物地圖</h1>
            <!-- 說明維持預設收合，內容一字未改，只是從頁首搬進抽屜。 -->
            <details class="hero-note">
              <summary>關於這份地圖</summary>
              <p class="hero-copy">依區域與類別快速找順路店家。地圖座標供初步定位，實際出發前請以官方資料確認營業時間，並使用 Google Maps 完整搜尋結果導航。</p>
            </details>
          </header>
          <div class="legend" aria-label="地圖標記圖例">
            <span><i class="shoe"></i>鞋款</span>
            <span><i class="drug"></i>藥妝</span>
            <span><i class="daily"></i>生活雜貨</span>
            <span><i class="supermarket"></i>超市</span>
            <span><i class="convenience"></i>便利商店</span>
            <span><i class="electronics"></i>家電</span>
            <span><i class="gift-food"></i>食品伴手禮</span>
            <span><i class="clothing"></i>服飾用品</span>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <nav class="kij-bottombar" aria-label="主要導覽">
    <a href="index.html"><i>🛍️</i>清單</a>
    <a href="itinerary.html"><i>🗓️</i>行程</a>
    <a href="map.html" class="active" aria-current="page"><i>🗺️</i>地圖</a>
  </nav>

  <script>
    /* Leaflet 現在是自帶的同源檔案，不再需要「unpkg 失敗就換 cdnjs」那條備援鏈。
       但仍然保留 Promise 形式的載入結果：map-app.js 的整套降級路徑
       （沒有 Leaflet 就只畫店家清單、不畫地圖）都建立在這兩個旗標上，
       而自帶檔案一樣可能因為部署漏檔或快取毀損而載不到。
       換句話說，這裡改掉的是「從哪裡拿」，不是「拿不到怎麼辦」。 */
    function loadMapDependency(src, ready) {
      return new Promise((resolve) => {
        if (ready()) return resolve(true);
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve(ready());
        script.onerror = () => resolve(false);
        document.head.append(script);
      });
    }

    window.__leafletReady = loadMapDependency(
      'assets/vendor/leaflet/leaflet.js?v=20260902.1',
      () => typeof window.L !== 'undefined'
    );

    window.__markerClusterReady = window.__leafletReady.then((leafletLoaded) => {
      if (!leafletLoaded) return false;
      return loadMapDependency(
        'assets/vendor/leaflet.markercluster/leaflet.markercluster.js?v=20260902.1',
        () => typeof window.L?.markerClusterGroup === 'function'
      );
    });
  </script>
  <script type="module" src="scripts/map-app.js?v=20260902.1"></script>
  <script src="scripts/register-sw.js?v=20260902.1" defer></script>
</body>
</html>
