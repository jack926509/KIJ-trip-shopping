<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小倉・博多・天神購物地圖｜北九州之旅</title>
  <meta name="description" content="北九州之旅的小倉、博多與天神購物地圖，可依區域與店家類別篩選。">
  <script>
    window.__mapFallbackRequested = false;
    function showMapFallback() {
      window.__mapFallbackRequested = true;
      const mapElement = document.getElementById('map');
      const fallbackElement = document.getElementById('mapFallback');
      if (mapElement) mapElement.hidden = true;
      if (fallbackElement) fallbackElement.hidden = false;
    }
  </script>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
    onerror="showMapFallback()"
  >
  <link rel="stylesheet" href="assets/kij.css">
  <style>
    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #26302c;
      --muted: #727874;
      --green: #2f6d5e;
      --green-dark: #1f5145;
      --soft: #e8f2ee;
      --line: #e7e1d8;
      --gold: #d8a414;
      --warn: #b4571f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #faf9f6, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    a { color: inherit; }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(47, 109, 94, .32);
      outline-offset: 3px;
    }

    .wrap {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 14px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    .hero {
      padding: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 12px 34px rgba(55, 48, 39, .08);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4.5vw, 42px);
      letter-spacing: -.025em;
      line-height: 1.15;
    }

    .hero-copy {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .filter-panel {
      position: sticky;
      top: 0;
      z-index: 900;
      margin: 18px 0;
      padding: 13px 16px;
      background: rgba(250, 249, 246, .94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .06);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 14px 22px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-group + .filter-group { margin-top: 0; }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-label {
      flex: 0 0 auto;
      width: 42px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .filter-group button {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 0;
      border-radius: 999px;
      background: #ece8e1;
      color: #4e5652;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .filter-group button:hover { background: #e1ddd5; }

    .filter-group button.active {
      background: var(--green);
      color: #fff;
    }

    .store-type-select {
      width: min(100%, 330px);
      min-height: 44px;
      padding: 9px 38px 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .result-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-line strong { color: var(--green); }

    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .legend::-webkit-scrollbar { display: none; }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票 */
    .legend .shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .legend .drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .legend .daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .legend .supermarket { background: #a04a10; } /* 對應 .kij-cat-food */

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(380px, .88fr);
      gap: 18px;
      align-items: start;
    }

    .map-panel {
      position: sticky;
      top: 144px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .06);
    }

    .map-attribution {
      position: absolute;
      right: 9px;
      bottom: 8px;
      z-index: 500;
      padding: 3px 6px;
      background: rgba(255, 255, 255, .9);
      border-radius: 4px;
      color: #385e52;
      font-size: 11px;
      line-height: 1.3;
    }

    .map-attribution a { color: inherit; }
    #map[hidden] + .map-attribution { display: none; }

    #map {
      width: 100%;
      height: min(64vh, 660px);
      min-height: 520px;
      background: #e8ece8;
    }

    #mapFallback {
      min-height: 500px;
      padding: 52px 28px;
      background: linear-gradient(145deg, var(--soft), #f7f4ed);
      text-align: center;
    }

    #mapFallback[hidden],
    #map[hidden] { display: none; }

    .fallback-icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 70px auto 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--green);
      font-size: 28px;
      box-shadow: 0 8px 22px rgba(55, 48, 39, .08);
    }

    #mapFallback h2 { margin: 0 0 8px; font-size: 22px; }

    #mapFallback p {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .store-list-panel {
      max-height: min(64vh, 660px);
      padding-right: 4px;
      overflow-y: auto;
      scrollbar-color: #c9c3b8 transparent;
      scrollbar-width: thin;
    }

    #storeList {
      display: grid;
      gap: 12px;
    }

    .store-card {
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 19px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .055);
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }

    .store-card:hover,
    .store-card.is-focused {
      transform: translateY(-2px);
      border-color: rgba(47, 109, 94, .55);
      box-shadow: 0 12px 28px rgba(55, 48, 39, .10);
    }

    .store-card.is-focused {
      border-width: 2px;
      border-color: #2f6d5e;
      background: linear-gradient(135deg, #ffffff, #f0f7f4);
    }

    .store-focus {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .area-tag { background: var(--soft); color: var(--green); }
    .category-tag { background: #f2eee8; color: #665e54; }
    .category-convenience { background: #fff1f1; color: #b23a48; }
    .category-electronics { background: #f0edff; color: #6552a4; }
    .category-gift-food { background: #fff7dd; color: #8b6500; }
    .category-shoe { background: #e7f0ff; color: #28639d; }
    .category-drug { background: #e7f6f2; color: #0a7a6a; }
    .category-daily { background: #fff2df; color: #a55b09; }
    .category-supermarket { background: #fff0e7; color: #a04a10; }

    .store-name {
      display: block;
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.012em;
      line-height: 1.4;
    }

    .brand {
      margin: 3px 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .details {
      display: grid;
      gap: 7px;
      margin: 0;
    }

    .details div {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 8px;
      font-size: 13px;
      line-height: 1.55;
    }

    .details dt { color: var(--muted); }
    .details dd { margin: 0; font-weight: 650; }

    .note {
      margin: 13px 0 0;
      padding: 10px 12px;
      background: #faf8f4;
      border-left: 3px solid var(--gold);
      border-radius: 9px;
      color: #625a51;
      font-size: 12px;
      line-height: 1.65;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .maps-link {
      background: #26302c;
      border-color: #26302c;
      color: #fff;
    }

    .maps-link:hover { background: #101714; border-color: #101714; }

    .action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .action-link:hover { background: var(--soft); }

    .maps-link {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .maps-link:hover { background: var(--green-dark); }

    .store-products {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .store-products-label {
      display: block;
      margin-bottom: 8px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
    }

    .store-products-thumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .store-product-thumb {
      display: block;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .store-product-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .store-products-more {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    #emptyState {
      padding: 48px 20px;
      background: #fff;
      border: 1px dashed #ccc4b9;
      border-radius: 19px;
      color: var(--muted);
      text-align: center;
    }

    #emptyState[hidden] { display: none; }
    #emptyState strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }

    #resetFiltersBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-min, 44px);
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: #fff;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }

    #resetFiltersBtn:hover { background: var(--soft); }

    .leaflet-container { font: inherit; }

    .map-pin {
      display: block;
      width: 28px;
      height: 28px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 8px;
      box-shadow: 0 4px 12px rgba(38, 48, 44, .3);
      transform: rotate(-45deg);
    }

    .map-pin span {
      display: block;
      width: 8px;
      height: 8px;
      margin: 7px;
      background: #fff;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票 */
    .map-pin--shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .map-pin--drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .map-pin--daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .map-pin--supermarket { background: #a04a10; } /* 對應 .kij-cat-food */
    .map-pin--convenience { background: #b23a48; }
    .map-pin--electronics { background: #6552a4; }
    .map-pin--gift-food { background: #8b6500; }

    .popup-content { min-width: 180px; }
    .popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .popup-content span { color: var(--muted); font-size: 12px; line-height: 1.5; }

    @media (max-width: 820px) {
      .wrap { width: min(100% - 18px, 1240px); padding-top: 10px; }
      .hero { padding: 21px 18px; }
      .filter-panel { top: 0; margin: 12px 0; padding: 11px 12px; border-radius: 15px; grid-template-columns: 1fr; gap: 10px; }
      .filter-label { width: 38px; }
      .content-grid { grid-template-columns: 1fr; }
      .map-panel { position: static; }
      .store-list-panel { max-height: none; padding-right: 0; overflow: visible; }
      #map { height: 52vh; min-height: 390px; }
      #mapFallback { min-height: 390px; }
      .fallback-icon { margin-top: 25px; }
      .result-line { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 480px) {
      .wrap { width: min(100% - 14px, 1240px); }
      .hero-copy { font-size: 13px; }
      .filter-group button { padding: 7px 10px; }
      #map { height: 46vh; min-height: 330px; }
      #mapFallback { min-height: 330px; padding: 28px 20px; }
      .fallback-icon { margin-top: 16px; }
      .store-card { padding: 15px; }
      .details div { grid-template-columns: 58px minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="index.html" aria-label="返回北九州之旅購物清單">← 返回購物清單</a>

    <header class="hero">
      <p class="eyebrow">KOKURA · HAKATA · TENJIN</p>
      <h1>小倉・博多・天神購物地圖</h1>
      <p class="hero-copy">依區域與類別快速找順路店家。地圖座標供初步定位，實際出發前請以官方資料確認營業時間，並使用 Google Maps 完整搜尋結果導航。</p>
    </header>

    <section class="filter-panel" aria-label="店家篩選">
      <div class="filter-group" aria-label="區域篩選">
        <span class="filter-label">區域</span>
        <button class="active" type="button" data-area="all" aria-pressed="true">全部</button>
        <button type="button" data-area="kokura" aria-pressed="false">小倉</button>
        <button type="button" data-area="hakata" aria-pressed="false">博多</button>
        <button type="button" data-area="tenjin" aria-pressed="false">天神</button>
      </div>
      <div class="filter-group" aria-label="店家分類篩選">
        <label class="filter-label" for="storeTypeFilter">店家</label>
        <select id="storeTypeFilter" class="store-type-select">
          <option value="all">全部店家分類</option>
          <option value="shoe">鞋店</option>
          <option value="drug">藥妝</option>
          <option value="daily">生活雜貨（3COINS／DAISO）</option>
          <option value="supermarket">超市／賣場</option>
          <option value="convenience">便利商店</option>
          <option value="electronics">家電</option>
          <option value="gift-food">食品伴手禮</option>
        </select>
      </div>
    </section>

    <div class="result-line">
      <span id="resultCount" aria-live="polite"></span>
      <div class="legend" aria-label="地圖標記圖例">
        <span><i class="shoe"></i>鞋款</span>
        <span><i class="drug"></i>藥妝</span>
        <span><i class="daily"></i>生活雜貨</span>
        <span><i class="supermarket"></i>超市</span>
        <span><i class="convenience"></i>便利商店</span>
        <span><i class="electronics"></i>家電</span>
        <span><i class="gift-food"></i>食品伴手禮</span>
      </div>
    </div>

    <div class="content-grid">
      <section class="map-panel" aria-label="店家地圖">
        <div id="map"></div>
        <div class="map-attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors</div>
        <div id="mapFallback" hidden>
          <div class="fallback-icon" aria-hidden="true">⌖</div>
          <h2>地圖暫時無法載入</h2>
          <p>店家清單與篩選仍可正常使用；請從卡片開啟 Google Maps 導航或官方資料。</p>
        </div>
      </section>

      <section class="store-list-panel" aria-label="店家清單">
        <div id="storeList"></div>
        <div id="emptyState" hidden>
          <strong>沒有符合條件的店家</strong>
          請調整區域或類別篩選。
          <div>
            <button type="button" id="resetFiltersBtn">重設篩選</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <nav class="kij-bottombar">
    <a href="index.html"><i>🛍️</i>清單</a>
    <a href="#" class="active" aria-current="page"><i>🗺️</i>地圖</a>
  </nav>

    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    onerror="showMapFallback()"

      { id: 'biccamera-tenjin-1', name: 'BicCamera 天神 1 號館', brand: 'BicCamera', category: 'electronics', area: 'tenjin', address: '福岡県福岡市中央区今泉 1-25-1', hours: '10:00–21:00', note: 'Panasonic 吹風機的主要採買點；型號、電壓規格、庫存與免稅資格請結帳前確認。', lat: 33.586903, lng: 130.401108, officialUrl: 'https://biccamera.co.jp/language/chinese-tenjin.html', officialSources: [{ label: 'BicCamera 天神官方店鋪資訊', url: 'https://biccamera.co.jp/language/chinese-tenjin.html' }], mapsQuery: 'ビックカメラ 天神1号館 福岡県福岡市中央区今泉 1-25-1' },
      { id: 'kayanoya-hakata-station-daitos', name: '茅乃舍 博多站 DEITOS 店', brand: '茅乃舍', category: 'gift-food', area: 'hakata', address: '福岡県福岡市博多区博多駅中央街 1-1 博多デイトス', hours: '依博多 DEITOS 當日公告', note: '茅乃舍高湯包與茶碗蒸し的素的博多採買點；季節商品與禮盒請以店內為準。', lat: 33.589912, lng: 130.420395, officialUrl: 'https://www.kubara.jp/shoplist/kayanoya/?wh=pc_menu', officialSources: [{ label: '茅乃舍官方店鋪列表', url: 'https://www.kubara.jp/shoplist/kayanoya/?wh=pc_menu' }], mapsQuery: '茅乃舎 博多駅デイトス店 福岡県福岡市博多区博多駅中央街 1-1' },
      { id: 'kayanoya-kokura-izutsuya', name: '茅乃舍 小倉井筒屋店', brand: '茅乃舍', category: 'gift-food', area: 'kokura', address: '福岡県北九州市小倉北区船場町 1-1 井筒屋小倉店', hours: '依井筒屋當日公告', note: '小倉逛街動線上的茅乃舍據點；季節商品與禮盒請以店內為準。', lat: 33.885441, lng: 130.877686, officialUrl: 'https://www.kubara.jp/shoplist/kayanoya/?wh=pc_menu', officialSources: [{ label: '茅乃舍官方店鋪列表', url: 'https://www.kubara.jp/shoplist/kayanoya/?wh=pc_menu' }], mapsQuery: '茅乃舎 小倉井筒屋店 福岡県北九州市小倉北区船場町 1-1' },
      { id: 'hands-hakata', name: 'HANDS 博多店', brand: 'HANDS', category: 'daily', area: 'hakata', address: '福岡県福岡市博多区博多駅中央街 1-1 アミュプラザ博多 1–5F', hours: '10:00–20:00', note: '晴雨傘與日用品的到店確認點；品項、顏色與庫存不保證，請以店內查詢為準。', lat: 33.589912, lng: 130.420395, officialUrl: 'https://store.hands.net/hakata/', officialSources: [{ label: 'HANDS 博多店官方資訊', url: 'https://store.hands.net/hakata/' }], mapsQuery: 'ハンズ博多店 福岡県福岡市博多区博多駅中央街 1-1' }
    ];

    const AREA_LABELS = { hakata: '博多', tenjin: '天神', kokura: '小倉' };
    const CATEGORY_LABELS = { shoe: '鞋款', drug: '藥妝', daily: '生活雜貨', supermarket: '超市', convenience: '便利商店', electronics: '家電', 'gift-food': '食品伴手禮' };
    const MARKER_HTML = {
      shoe: '<span class="map-pin map-pin--shoe"><span aria-hidden="true"></span></span>',
      drug: '<span class="map-pin map-pin--drug"><span aria-hidden="true"></span></span>',
      daily: '<span class="map-pin map-pin--daily"><span aria-hidden="true"></span></span>',
      supermarket: '<span class="map-pin map-pin--supermarket"><span aria-hidden="true"></span></span>',
      convenience: '<span class="map-pin map-pin--convenience"><span aria-hidden="true"></span></span>',
      electronics: '<span class="map-pin map-pin--electronics"><span aria-hidden="true"></span></span>',
      'gift-food': '<span class="map-pin map-pin--gift-food"><span aria-hidden="true"></span></span>'
    };

    let activeArea = 'all';
    let activeCategory = 'all';
    let map = null;
    let markerLayer = null;
    const markers = new Map();

    function makeMapsUrl(store) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.mapsQuery)}`;
    }

    function visibleStores() {
      return STORES.filter(store =>
        (activeArea === 'all' || store.area === activeArea) &&
        (activeCategory === 'all' || store.category === activeCategory)
      );
    }

    function makeTextElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function makeDetail(label, value) {
      const row = document.createElement('div');
      row.append(makeTextElement('dt', '', label), makeTextElement('dd', '', value));
      return row;
    }

    function makeExternalLink(label, url, className) {
      const link = makeTextElement('a', className, label);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.addEventListener('click', event => event.stopPropagation());
      return link;
    }

    function productsForStore(storeId) {
      return PRODUCTS.filter((p) => p.stores.includes(storeId));
    }

    /* 對齊 index.html 的圖片載入失敗 fallback（顯示商品名稱首字色塊），
     * 沒有共用模組，靜態網站沒有建置流程，直接複製一份邏輯即可。 */
    function makeImgFallback(letter) {
      const div = document.createElement('div');
      div.className = 'kij-img-fallback';
      div.textContent = letter;
      return div;
    }

    function renderStoreProducts(store, container) {
      const items = productsForStore(store.id);
      if (items.length === 0) return; // 無對應商品時不顯示區塊，不顯示「可買 0 項」

      const wrap = document.createElement('div');
      wrap.className = 'store-products';
      wrap.append(makeTextElement('span', 'store-products-label', `這裡可買 ${items.length} 項`));

      const shown = items.slice(0, 5);
      const thumbRow = document.createElement('div');
      thumbRow.className = 'store-products-thumbs';
      shown.forEach((p) => {
        const link = document.createElement('a');
        link.href = `index.html#${p.id}`;
        link.className = 'store-product-thumb';
        const img = document.createElement('img');
        img.alt = p.name;
        img.addEventListener('error', () => {
          img.replaceWith(makeImgFallback(p.name[0]));
        }, { once: true });
        img.src = p.image;
        link.append(img);
        thumbRow.append(link);
      });
      if (items.length > 5) {
        thumbRow.append(makeTextElement('span', 'store-products-more', `+${items.length - 5}`));
      }
      wrap.append(thumbRow);
      container.append(wrap);
    }

    function createStoreCard(store) {
      const card = document.createElement('article');
      card.className = 'store-card';
      card.dataset.storeId = store.id;
      const focusButton = document.createElement('button');
      focusButton.type = 'button';
      focusButton.className = 'store-focus';
      focusButton.setAttribute('aria-label', `在地圖上聚焦：${store.name}`);
      focusButton.addEventListener('click', () => focusStore(store.id));

      const tagRow = document.createElement('span');
      tagRow.className = 'tag-row';
      tagRow.append(
        makeTextElement('span', 'tag area-tag', AREA_LABELS[store.area]),
        makeTextElement('span', `tag category-tag category-${store.category}`, CATEGORY_LABELS[store.category])
      );

      const title = makeTextElement('span', 'store-name', store.name);
      const brand = makeTextElement('span', 'brand', store.brand);
      const details = document.createElement('dl');
      details.className = 'details';
      details.append(
        makeDetail('地址', store.address),
        makeDetail('營業時間', store.hours)
      );

      const note = makeTextElement('p', 'note', store.note);
      const actions = document.createElement('div');
      actions.className = 'card-actions';
      actions.append(makeExternalLink('Google Maps 導航', makeMapsUrl(store), 'action-link maps-link'));
      const officialSources = store.officialSources || [];
      if (store.officialUrl) {
        const primarySource = officialSources.find((source) => source.url === store.officialUrl);
        actions.append(makeExternalLink(primarySource ? primarySource.label : '官方資料', store.officialUrl, 'action-link'));
      }
      officialSources
        .filter((source) => source.url !== store.officialUrl)
        .forEach((source) => actions.append(makeExternalLink(source.label, source.url, 'action-link')));

      focusButton.append(tagRow, title, brand);
      card.append(focusButton, details, note);
      renderStoreProducts(store, card);
      card.append(actions);
      return card;
    }

    function renderStores() {
      const stores = visibleStores();
      const list = document.getElementById('storeList');
      const emptyState = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');
      const fragment = document.createDocumentFragment();

      stores.forEach(store => fragment.append(createStoreCard(store)));
      list.replaceChildren(fragment);
      emptyState.hidden = stores.length !== 0;
      resultCount.replaceChildren(
        document.createTextNode('目前顯示 '),
        makeTextElement('strong', '', String(stores.length)),
        document.createTextNode(` 間店家（共 ${STORES.length} 間）`)
      );

      if (map && markerLayer) renderMarkers(stores);
    }

    function createPopup(store) {
      const popup = document.createElement('div');
      popup.className = 'popup-content';
      popup.append(
        makeTextElement('strong', '', store.name),
        makeTextElement('span', '', `${AREA_LABELS[store.area]}｜${CATEGORY_LABELS[store.category]}｜${store.address}`)
      );
      return popup;
    }

    function renderMarkers(stores) {
      markerLayer.clearLayers();
      markers.clear();

      stores.forEach(store => {
        const icon = L.divIcon({
          className: '',
          html: MARKER_HTML[store.category],
          iconSize: [32, 38],
          iconAnchor: [16, 34],
          popupAnchor: [0, -33]
        });
        const marker = L.marker([store.lat, store.lng], { icon, title: store.name });
        marker.bindPopup(createPopup(store));
        marker.on('click', () => focusStore(store.id, { scrollCard: true }));
        marker.addTo(markerLayer);
        markers.set(store.id, marker);
      });

      if (stores.length > 1) {
        map.fitBounds(L.latLngBounds(stores.map(store => [store.lat, store.lng])), { padding: [34, 34], maxZoom: 15 });
      } else if (stores.length === 1) {
        map.setView([stores[0].lat, stores[0].lng], 16);
      } else {
        map.setView([33.591, 130.405], 13);
      }
    }

    function applyFilters(filterType, value) {
      if (filterType === 'area') activeArea = value;
      if (filterType === 'category') activeCategory = value;

      document.querySelectorAll(`[data-${filterType}]`).forEach(button => {
        const isActive = button.dataset[filterType] === value;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
      renderStores();
    }

    function focusStore(id, { scrollCard = false } = {}) {
      const store = STORES.find(item => item.id === id);
      if (!store) return;

      document.querySelectorAll('.store-card').forEach(card => {
        card.classList.toggle('is-focused', card.dataset.storeId === id);
      });

      if (scrollCard) {
        document.querySelector(`.store-card[data-store-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      if (!map || !markers.has(id)) return;
      map.setView([store.lat, store.lng], Math.max(map.getZoom(), 16), { animate: true });
      markers.get(id).openPopup();
    }

    function bindFilterButtons() {
      document.querySelectorAll('[data-area]').forEach(button => {
        button.addEventListener('click', () => applyFilters('area', button.dataset.area));
      });
      document.getElementById('storeTypeFilter').addEventListener('change', event => {
        applyFilters('category', event.target.value);
      });
    }

    function applyStoreUrlParam() {
      const storeId = new URLSearchParams(location.search).get('store');
      if (!storeId) return;
      const store = STORES.find(item => item.id === storeId);
      if (!store) return;
      activeArea = store.area;
      activeCategory = store.category;
      document.querySelectorAll('[data-area]').forEach(button => {
        const isActive = button.dataset.area === store.area;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
      document.getElementById('storeTypeFilter').value = store.category;
      renderStores();
      focusStore(store.id);
    }

    function initMap() {
      if (window.__mapFallbackRequested || typeof L === 'undefined') {
        throw new Error('Leaflet 無法載入');
      }

      map = L.map('map', { attributionControl: false }).setView([33.591, 130.405], 13);
      markerLayer = L.layerGroup().addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      })
        .on('tileerror', showMapFallback)
        .addTo(map);
      renderMarkers(visibleStores());
    }

    bindFilterButtons();
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      applyFilters('area', 'all');
      applyFilters('category', 'all');
      document.getElementById('storeTypeFilter').value = 'all';
    });
    renderStores();

    try {
      initMap();
    } catch (error) {
      showMapFallback();
    }
    applyStoreUrlParam();
  </script>
</body>
