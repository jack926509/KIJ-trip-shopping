<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小倉・博多・天神購物地圖｜北九州之旅</title>
  <meta name="description" content="北九州之旅的小倉、博多與天神購物地圖，可依區域與店家類別篩選。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2f6d5e">
  <script>
    window.__mapFallbackRequested = false;
    function showMapFallback() {
      window.__mapFallbackRequested = true;
      const mapElement = document.getElementById('map');
      const fallbackElement = document.getElementById('mapFallback');
      if (mapElement) mapElement.hidden = true;
      if (fallbackElement) fallbackElement.hidden = false;
    }
  </script>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
    onerror="showMapFallback()"
  >
  <link rel="stylesheet" href="assets/kij.css">
  <style>
    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #26302c;
      --muted: #727874;
      --green: #2f6d5e;
      --green-dark: #1f5145;
      --soft: #e8f2ee;
      --line: #e7e1d8;
      --gold: #d8a414;
      --warn: #b4571f;
      /* 以下對應 assets/kij.css 的命名。共用元件（底部導覽）寫的是 --accent，
       * 本檔若不定義就會掉回 kij.css :root 的珊瑚橘，跟清單頁對不起來。 */
      --accent: #2f6d5e;
      --accent-soft: #e8f2ee;
      --surface: #ffffff;
      --tap-min: 44px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #faf9f6, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    a { color: inherit; }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* 焦點樣式沿用 assets/kij.css 的 :focus-visible 規則，本檔不另訂一套 */

    .wrap {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    .hero {
      padding: 20px 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 12px 34px rgba(55, 48, 39, .08);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4.5vw, 42px);
      letter-spacing: -.025em;
      line-height: 1.15;
    }

    .hero-note { margin-top: 10px; }

    .hero-note summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: var(--tap-min);
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .hero-note summary::-webkit-details-marker { display: none; }

    .hero-note summary::after {
      content: "▾";
      font-size: 11px;
    }

    .hero-note[open] summary::after { content: "▴"; }

    .hero-copy {
      max-width: 760px;
      margin: 2px 0 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .filter-panel {
      position: sticky;
      top: 0;
      z-index: 900;
      margin: 18px 0;
      padding: 13px 16px;
      background: rgba(250, 249, 246, .94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .06);
      backdrop-filter: blur(12px);
      display: grid;
      /* 兩排各自佔滿一列：分類共 8 個 pill，擠在右半欄會被截掉一半 */
      grid-template-columns: 1fr;
      gap: 9px;
      align-items: center;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-group + .filter-group { margin-top: 0; }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-label {
      flex: 0 0 auto;
      width: 42px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .filter-group button {
      flex: 0 0 auto;
      /* 手指按得到：手機轉橫（寬 844px）時不會落回 38px */
      min-height: var(--tap-min);
      padding: 7px 13px;
      border: 0;
      border-radius: 999px;
      background: #ece8e1;
      color: #4e5652;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .filter-group button:hover { background: #e1ddd5; }

    .filter-group button.active {
      background: var(--green);
      color: #fff;
    }

    /* 兩排 pill 都可能超出寬度，右緣做漸層淡出提示「還可以往右滑」，
     * 不然使用者只會以為分類就到「家電」為止。 */
    .filter-group,
    .legend {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent);
    }

    .filter-group:not(.is-scrollable),
    .legend:not(.is-scrollable) {
      -webkit-mask-image: none;
      mask-image: none;
    }

    .result-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-line strong { color: var(--green); }

    .map-focus-hint {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .legend::-webkit-scrollbar { display: none; }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票。
     * 每一色必須與下方對應的 .map-pin--* 相同，否則圖例會與地圖上的標記對不起來；
     * 七個分類要全部列出，漏掉任何一個該色點會變成透明（看起來像沒有圖例）。 */
    .legend .shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .legend .drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .legend .daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .legend .supermarket { background: #a04a10; } /* 對應 .kij-cat-food */
    .legend .convenience { background: #b23a48; }
    .legend .electronics { background: #6552a4; }
    .legend .gift-food { background: #8b6500; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(380px, .88fr);
      gap: 18px;
      align-items: start;
    }

    .map-panel {
      position: sticky;
      top: 144px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .06);
    }

    .map-attribution {
      position: absolute;
      right: 9px;
      bottom: 8px;
      z-index: 500;
      padding: 3px 6px;
      background: rgba(255, 255, 255, .9);
      border-radius: 4px;
      color: #385e52;
      font-size: 11px;
      line-height: 1.3;
    }

    .map-attribution a { color: inherit; }
    #map[hidden] + .map-attribution { display: none; }

    #map {
      width: 100%;
      height: min(64vh, 660px);
      min-height: 520px;
      background: #e8ece8;
    }

    #mapFallback {
      min-height: 500px;
      padding: 52px 28px;
      background: linear-gradient(145deg, var(--soft), #f7f4ed);
      text-align: center;
    }

    #mapFallback[hidden],
    #map[hidden] { display: none; }

    .fallback-icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 70px auto 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--green);
      font-size: 28px;
      box-shadow: 0 8px 22px rgba(55, 48, 39, .08);
    }

    #mapFallback h2 { margin: 0 0 8px; font-size: 22px; }

    #mapFallback p {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .store-list-panel {
      max-height: min(64vh, 660px);
      padding-right: 4px;
      overflow-y: auto;
      scrollbar-color: #c9c3b8 transparent;
      scrollbar-width: thin;
    }

    #storeList {
      display: grid;
      gap: 12px;
    }

    .store-card {
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 19px;
      box-shadow: 0 7px 20px rgba(55, 48, 39, .055);
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }

    .store-card:hover,
    .store-card.is-focused {
      transform: translateY(-2px);
      border-color: rgba(47, 109, 94, .55);
      box-shadow: 0 12px 28px rgba(55, 48, 39, .10);
    }

    .store-card.is-focused {
      border-width: 2px;
      border-color: #2f6d5e;
      background: linear-gradient(135deg, #ffffff, #f0f7f4);
    }

    .store-focus {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .tag-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .area-tag { background: var(--soft); color: var(--green); }
    .category-tag { background: #f2eee8; color: #665e54; }
    .category-convenience { background: #fff1f1; color: #b23a48; }
    .category-electronics { background: #f0edff; color: #6552a4; }
    .category-gift-food { background: #fff7dd; color: #8b6500; }
    .category-shoe { background: #e7f0ff; color: #28639d; }
    .category-drug { background: #e7f6f2; color: #0a7a6a; }
    .category-daily { background: #fff2df; color: #a55b09; }
    .category-supermarket { background: #fff0e7; color: #a04a10; }

    .store-name {
      display: block;
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.012em;
      line-height: 1.4;
    }

    .brand {
      margin: 3px 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .details {
      display: grid;
      gap: 7px;
      margin: 0;
    }

    .details div {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 8px;
      font-size: 13px;
      line-height: 1.55;
    }

    .details dt { color: var(--muted); }
    .details dd { margin: 0; font-weight: 650; }

    .note {
      margin: 13px 0 0;
      padding: 10px 12px;
      background: #faf8f4;
      border-left: 3px solid var(--gold);
      border-radius: 9px;
      color: #625a51;
      font-size: 12px;
      line-height: 1.65;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .maps-link {
      background: #26302c;
      border-color: #26302c;
      color: #fff;
    }

    .maps-link:hover { background: #101714; border-color: #101714; }

    .action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* 「Google Maps 導航」是站在店門口最常按的連結，維持在手指按得到的尺寸 */
      min-height: var(--tap-min);
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
      text-decoration: none;
    }

    .action-link:hover { background: var(--soft); }

    .maps-link {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .maps-link:hover { background: var(--green-dark); }

    .store-products {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .store-products-label {
      display: block;
      margin-bottom: 8px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 850;
    }

    .store-products-thumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .store-product-thumb {
      display: block;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .store-product-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 已在清單頁勾選「已購買」的商品在這裡淡出，一眼看出還有哪幾項要買 */
    .store-product-thumb.is-bought {
      opacity: .38;
      filter: grayscale(1);
    }

    .store-products-more {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    #emptyState {
      padding: 48px 20px;
      background: #fff;
      border: 1px dashed #ccc4b9;
      border-radius: 19px;
      color: var(--muted);
      text-align: center;
    }

    #emptyState[hidden] { display: none; }
    #emptyState strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }

    #resetFiltersBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap-min, 44px);
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: #fff;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }

    #resetFiltersBtn:hover { background: var(--soft); }

    .leaflet-container { font: inherit; }

    .map-pin {
      display: block;
      width: 28px;
      height: 28px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 8px;
      box-shadow: 0 4px 12px rgba(38, 48, 44, .3);
      transform: rotate(-45deg);
    }

    .map-pin span {
      display: block;
      width: 8px;
      height: 8px;
      margin: 7px;
      background: #fff;
      border-radius: 50%;
    }

    /* 分類色票與 assets/kij.css 的 .kij-cat-* 文字色保持一致，不在本檔另建一套色票 */
    .map-pin--shoe { background: #1f5fa8; } /* 對應 .kij-cat-shoe */
    .map-pin--drug { background: #0a7a6a; } /* 對應 .kij-cat-drug */
    .map-pin--daily { background: #a04a10; } /* 對應 .kij-cat-food（daily／supermarket 皆為橘色系） */
    .map-pin--supermarket { background: #a04a10; } /* 對應 .kij-cat-food */
    .map-pin--convenience { background: #b23a48; }
    .map-pin--electronics { background: #6552a4; }
    .map-pin--gift-food { background: #8b6500; }

    .popup-content { min-width: 180px; }
    .popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .popup-content span { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .popup-content .popup-count { display: block; margin-top: 5px; color: var(--green-dark); font-weight: 850; }

    @media (max-width: 820px) {
      .wrap { width: min(100% - 18px, 1240px); padding-top: 10px; }
      .hero { padding: 21px 18px; }
      .filter-panel { top: 0; margin: 12px 0; padding: 11px 12px; border-radius: 15px; gap: 8px; }
      .filter-label { width: 38px; }
      .content-grid { grid-template-columns: 1fr; }
      /* 手機不 sticky，但要留 relative：.map-attribution 是絕對定位，
         改成 static 會讓它掉到 body 座標系、疊在底部導覽上。 */
      .map-panel { position: relative; top: auto; }
      .store-list-panel { max-height: none; padding-right: 0; overflow: visible; }
      #map { height: 58vh; min-height: 420px; }
      #mapFallback { min-height: 420px; }
      .fallback-icon { margin-top: 25px; }
      /* 圖例改為整寬：原本在直排容器裡是縮到內容寬，
         右側「食品伴手禮」會被容器切掉且看不出可以捲。 */
      .result-line { align-items: stretch; flex-direction: column; gap: 8px; }
      .legend { width: 100%; }
    }

    @media (max-width: 540px) {
      .wrap { width: min(100% - 14px, 1240px); padding-top: 8px; }
      /* 頁首從「白底大卡片」改成單純標題行，把螢幕還給地圖 */
      .hero { padding: 2px 0 0; background: none; border: 0; border-radius: 0; box-shadow: none; }
      .eyebrow { margin-bottom: 4px; font-size: 11px; }
      h1 { font-size: 21px; letter-spacing: -.015em; }
      .hero-note { margin-top: 2px; }
      .hero-copy { font-size: 13px; }
      .filter-panel { margin: 10px 0; padding: 9px 10px; gap: 7px; }
      .filter-label { width: 34px; font-size: 11px; }
      .filter-group { gap: 6px; }
      .filter-group button { padding: 7px 12px; }
      .result-line { margin-bottom: 10px; }
      #map { height: 58vh; min-height: 400px; }
      #mapFallback { min-height: 400px; padding: 28px 20px; }
      .fallback-icon { margin-top: 16px; }
      .store-card { padding: 15px; }
      .details div { grid-template-columns: 58px minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">KOKURA · HAKATA · TENJIN</p>
      <h1>小倉・博多・天神購物地圖</h1>
      <!-- 說明改為預設收合：手機上這段文字原本把地圖擠到螢幕外，
           但內容（座標僅供定位、以官方營業時間為準）仍需保留。 -->
      <details class="hero-note">
        <summary>關於這份地圖</summary>
        <p class="hero-copy">依區域與類別快速找順路店家。地圖座標供初步定位，實際出發前請以官方資料確認營業時間，並使用 Google Maps 完整搜尋結果導航。</p>
      </details>
    </header>

    <section class="filter-panel" aria-label="店家篩選">
      <div class="filter-group" aria-label="區域篩選">
        <span class="filter-label">區域</span>
        <button class="active" type="button" data-area="all" aria-pressed="true">全部</button>
        <button type="button" data-area="kokura" aria-pressed="false">小倉</button>
        <button type="button" data-area="hakata" aria-pressed="false">博多</button>
        <button type="button" data-area="tenjin" aria-pressed="false">天神</button>
      </div>
      <!-- 分類由原生 <select> 改成 pill 按鈕：與區域列同一種操作方式，
           手機上一按就切換，不必先開下拉再捲動選單。 -->
      <div class="filter-group" id="storeTypeFilter" aria-label="店家分類篩選">
        <span class="filter-label">店家</span>
        <button class="active" type="button" data-category="all" aria-pressed="true">全部</button>
        <button type="button" data-category="shoe" aria-pressed="false">鞋店</button>
        <button type="button" data-category="drug" aria-pressed="false">藥妝</button>
        <button type="button" data-category="daily" aria-pressed="false">生活雜貨</button>
        <button type="button" data-category="supermarket" aria-pressed="false">超市</button>
        <button type="button" data-category="convenience" aria-pressed="false">便利商店</button>
        <button type="button" data-category="electronics" aria-pressed="false">家電</button>
        <button type="button" data-category="gift-food" aria-pressed="false">食品伴手禮</button>
      </div>
    </section>

    <div class="result-line">
      <span id="resultCount" aria-live="polite"></span>
      <div class="legend" aria-label="地圖標記圖例">
        <span><i class="shoe"></i>鞋款</span>
        <span><i class="drug"></i>藥妝</span>
        <span><i class="daily"></i>生活雜貨</span>

    const CATEGORY_LABELS = { shoe: '鞋款', drug: '藥妝', daily: '生活雜貨', supermarket: '超市', convenience: '便利商店', electronics: '家電', 'gift-food': '食品伴手禮' };
    const MARKER_HTML = {
      shoe: '<span class="map-pin map-pin--shoe"><span aria-hidden="true"></span></span>',
      drug: '<span class="map-pin map-pin--drug"><span aria-hidden="true"></span></span>',
      daily: '<span class="map-pin map-pin--daily"><span aria-hidden="true"></span></span>',

      convenience: '<span class="map-pin map-pin--convenience"><span aria-hidden="true"></span></span>',

      'gift-food': '<span class="map-pin map-pin--gift-food"><span aria-hidden="true"></span></span>'
    };

    let activeArea = 'all';
    let activeCategory = 'all';
    let map = null;
    let markerLayer = null;
    const markers = new Map();

    function makeMapsUrl(store) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.mapsQuery)}`;
    }

    function visibleStores() {
      return STORES.filter(store =>
        (activeArea === 'all' || store.area === activeArea) &&
        (activeCategory === 'all' || store.category === activeCategory)
      );
    }

    function makeTextElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function makeDetail(label, value) {
      const row = document.createElement('div');
      row.append(makeTextElement('dt', '', label), makeTextElement('dd', '', value));
      return row;
    }

    function makeExternalLink(label, url, className) {
      const link = makeTextElement('a', className, label);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.addEventListener('click', event => event.stopPropagation());
      return link;
    }

    function productsForStore(storeId, relation) {
      const field = relation === 'candidate' ? 'storeCandidates' : 'stores';
      return PRODUCTS.filter((product) => (product[field] || []).includes(storeId));
    }

    /* 對齊 index.html 的圖片載入失敗 fallback（顯示商品名稱首字色塊），
     * 沒有共用模組，靜態網站沒有建置流程，直接複製一份邏輯即可。 */
    function makeImgFallback(letter) {
      const div = document.createElement('div');
      div.className = 'kij-img-fallback';
      div.textContent = letter;
      return div;
    }

    /* 清單頁的已購買狀態存在 localStorage，地圖頁只讀不寫：
     * 站在店門口最想知道的是「這家店我還有幾項沒買」。 */
    function isBought(id) {
      try {
        return localStorage.getItem(`kij_bought_${id}`) === '1';
      } catch (error) {
        return false;
      }
    }

    /* 只有 tracking 為 buy 的品項才有「買了沒」的狀態；
     * 鞋款是到店試穿的比較項目，不能算進未購買數。 */
    function remainingText(items) {
      const buyItems = items.filter((product) => product.tracking === 'buy');
      if (buyItems.length === 0) return '';
      const remaining = buyItems.filter((product) => !isBought(product.id)).length;
      return remaining === 0 ? '・都買齊了' : `・還沒買 ${remaining} 項`;
    }

    function renderProductGroup(items, label, container, { showRemaining = false } = {}) {
      if (items.length === 0) return;
      const wrap = document.createElement('div');
      wrap.className = 'store-products';
      const labelText = `${label} ${items.length} 項${showRemaining ? remainingText(items) : ''}`;
      wrap.append(makeTextElement('span', 'store-products-label', labelText));

      const shown = items.slice(0, 5);
      const thumbRow = document.createElement('div');
      thumbRow.className = 'store-products-thumbs';
      shown.forEach((p) => {
        const link = document.createElement('a');
        link.href = `index.html#${p.id}`;
        link.className = `store-product-thumb${showRemaining && p.tracking === 'buy' && isBought(p.id) ? ' is-bought' : ''}`;
        const img = document.createElement('img');
        img.alt = p.name;
        img.addEventListener('error', () => {
          img.replaceWith(makeImgFallback(p.name[0]));
        }, { once: true });
        img.src = p.image;
        link.append(img);
        thumbRow.append(link);
      });
      if (items.length > 5) {
        thumbRow.append(makeTextElement('span', 'store-products-more', `+${items.length - 5}`));
      }
      wrap.append(thumbRow);
      container.append(wrap);
    }

    function renderStoreProducts(store, container) {
      renderProductGroup(productsForStore(store.id, 'confirmed'), '你的清單', container, { showRemaining: true });
      renderProductGroup(productsForStore(store.id, 'candidate'), '建議到店確認', container);
    }

    function createStoreCard(store) {
      const card = document.createElement('article');
      card.className = 'store-card';
      card.dataset.storeId = store.id;
      const focusButton = document.createElement('button');
      focusButton.type = 'button';
      focusButton.className = 'store-focus';
      focusButton.setAttribute('aria-label', `在地圖上聚焦：${store.name}`);
      focusButton.addEventListener('click', () => focusStore(store.id));

      const tagRow = document.createElement('span');
      tagRow.className = 'tag-row';
      tagRow.append(
        makeTextElement('span', 'tag area-tag', AREA_LABELS[store.area]),
        makeTextElement('span', `tag category-tag category-${store.category}`, CATEGORY_LABELS[store.category])
      );

      const title = makeTextElement('span', 'store-name', store.name);
      const brand = makeTextElement('span', 'brand', store.brand);
      const details = document.createElement('dl');
      details.className = 'details';
      details.append(
        makeDetail('地址', store.address),
        makeDetail('營業時間', store.hours)
      );

      const note = makeTextElement('p', 'note', store.note);
      const actions = document.createElement('div');
      actions.className = 'card-actions';
      actions.append(makeExternalLink('Google Maps 導航', makeMapsUrl(store), 'action-link maps-link'));
      const officialSources = store.officialSources || [];
      if (store.officialUrl) {
        const primarySource = officialSources.find((source) => source.url === store.officialUrl);
        actions.append(makeExternalLink(primarySource ? primarySource.label : '官方資料', store.officialUrl, 'action-link'));
      }
      officialSources
        .filter((source) => source.url !== store.officialUrl)
        .forEach((source) => actions.append(makeExternalLink(source.label, source.url, 'action-link')));

      focusButton.append(tagRow, title, brand);
      card.append(focusButton, details, note);
      renderStoreProducts(store, card);
      card.append(actions);
      return card;
    }

    /* 區域選「全部」時只框住博多／天神那一簇。
     * 小倉離福岡約 40 公里，兩簇一起框會縮到看得見整個九州、店家全擠成一團；
     * 小倉的圖釘仍在地圖上，往東捲或按「小倉」就會重新對焦過去。
     * 若篩完剩下的全是小倉的店，就照常框小倉。 */
    function framedStores(stores) {
      if (activeArea !== 'all') return stores;
      const nonKokura = stores.filter(store => store.area !== 'kokura');
      return nonKokura.length > 0 ? nonKokura : stores;
    }

    function renderStores() {
      const stores = visibleStores();
      const list = document.getElementById('storeList');
      const emptyState = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');
      const fragment = document.createDocumentFragment();

      stores.forEach(store => fragment.append(createStoreCard(store)));
      list.replaceChildren(fragment);
      emptyState.hidden = stores.length !== 0;
      resultCount.replaceChildren(
        document.createTextNode('目前顯示 '),
        makeTextElement('strong', '', String(stores.length)),
        document.createTextNode(` 間店家（共 ${STORES.length} 間）`)
      );

      /* 有店家被排除在框選之外時才提示，講明白小倉在哪，不然會以為漏掉了。
         條件與 framedStores 綁在一起：若篩完只剩小倉的店，地圖本來就對焦小倉，不該出現這句。 */
      if (framedStores(stores).length !== stores.length) {
        resultCount.append(makeTextElement('span', 'map-focus-hint', '地圖先對焦博多・天神；小倉請按上方「小倉」'));
      }

      if (map && markerLayer) renderMarkers(stores);
    }

    function createPopup(store) {
      const popup = document.createElement('div');
      popup.className = 'popup-content';
      popup.append(
        makeTextElement('strong', '', store.name),
        makeTextElement('span', '', `${AREA_LABELS[store.area]}｜${CATEGORY_LABELS[store.category]}｜${store.address}`)
      );

      // 點地圖圖釘先看到「這家店我還有幾項沒買」，不必再往下找店家卡片
      const linked = productsForStore(store.id, 'confirmed');
      if (linked.length > 0) {
        popup.append(makeTextElement('span', 'popup-count', `你的清單 ${linked.length} 項${remainingText(linked)}`));
      }
      return popup;
    }

    function renderMarkers(stores) {
      markerLayer.clearLayers();
      markers.clear();

      stores.forEach(store => {
        const icon = L.divIcon({
          className: '',
          html: MARKER_HTML[store.category],
          iconSize: [32, 38],
          iconAnchor: [16, 34],
          popupAnchor: [0, -33]
        });
        const marker = L.marker([store.lat, store.lng], { icon, title: store.name });
        marker.bindPopup(createPopup(store));
        marker.on('click', () => focusStore(store.id, { scrollCard: true }));
        marker.addTo(markerLayer);
        markers.set(store.id, marker);
      });

      const framed = framedStores(stores);

      if (framed.length > 1) {
        map.fitBounds(L.latLngBounds(framed.map(store => [store.lat, store.lng])), { padding: [34, 34], maxZoom: 15 });
      } else if (framed.length === 1) {
        map.setView([framed[0].lat, framed[0].lng], 16);
      } else {
        map.setView([33.591, 130.405], 13);
      }
    }

    function applyFilters(filterType, value) {
      if (filterType === 'area') activeArea = value;
      if (filterType === 'category') activeCategory = value;

      document.querySelectorAll(`[data-${filterType}]`).forEach(button => {
        const isActive = button.dataset[filterType] === value;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
      renderStores();
    }

    function focusStore(id, { scrollCard = false } = {}) {
      const store = STORES.find(item => item.id === id);
      if (!store) return;

      document.querySelectorAll('.store-card').forEach(card => {
        card.classList.toggle('is-focused', card.dataset.storeId === id);
      });

      if (scrollCard) {
        document.querySelector(`.store-card[data-store-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      if (!map || !markers.has(id)) return;
      map.setView([store.lat, store.lng], Math.max(map.getZoom(), 16), { animate: true });
      markers.get(id).openPopup();
    }

    function bindFilterButtons() {
      document.querySelectorAll('[data-area]').forEach(button => {
        button.addEventListener('click', () => applyFilters('area', button.dataset.area));
      });
      document.querySelectorAll('[data-category]').forEach(button => {
        button.addEventListener('click', () => applyFilters('category', button.dataset.category));
      });
    }

    /* 被選中的篩選 pill 捲進可視範圍：分類共 8 個，手機上一列放不下，
     * 從網址參數進來時選中的那顆可能在畫面外。 */
    function revealActiveFilter(selector) {
      document.querySelector(`${selector}.active`)?.scrollIntoView({ block: 'nearest', inline: 'center' });
      markScrollableRows();
    }

    /* 從清單頁的「推薦店家」標籤進來時，必須在建立地圖「之前」就把篩選設好。
     * 若等地圖建好再改篩選：initMap 的第一次 fitBounds 會把縮放動畫排到下一個 frame，
     * 同一個 tick 內後續的 setView 會被那個動畫覆蓋回博多預設視野，
     * 圖釘就落在畫面外（實測 ?store=kayanoya-kokura-izutsuya 完全看不到店）。 */
    function readStoreUrlParam() {
      const storeId = new URLSearchParams(location.search).get('store');
      if (!storeId) return null;
      const store = STORES.find(item => item.id === storeId);
      if (!store) return null;
      activeArea = store.area;
      activeCategory = store.category;
      [['area', store.area], ['category', store.category]].forEach(([type, value]) => {
        document.querySelectorAll(`[data-${type}]`).forEach(button => {
          const isActive = button.dataset[type] === value;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });
      });
      return store;
    }

    function initMap() {
      if (window.__mapFallbackRequested || typeof L === 'undefined') {
        throw new Error('Leaflet 無法載入');
      }

      map = L.map('map', { attributionControl: false }).setView([33.591, 130.405], 13);
      markerLayer = L.layerGroup().addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      })
        .on('tileerror', showMapFallback)
        .addTo(map);
      renderMarkers(visibleStores());
    }

    /* 只有「右邊還有沒露出來的東西」時才掛右緣淡出。
     * 只看 scrollWidth > clientWidth 的話，捲到底最後一顆 pill 仍是淡的——
     * 而 revealActiveFilter 正好常把選中的那顆送到最右邊。 */
    function markScrollableRows() {
      document.querySelectorAll('.filter-group, .legend').forEach((row) => {
        row.classList.toggle('is-scrollable', row.scrollWidth - row.clientWidth - row.scrollLeft > 1);
      });
    }

    bindFilterButtons();
    markScrollableRows();
    window.addEventListener('resize', markScrollableRows);
    document.querySelectorAll('.filter-group, .legend').forEach((row) => {
      row.addEventListener('scroll', markScrollableRows, { passive: true });
    });
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      applyFilters('area', 'all');
      applyFilters('category', 'all');
    });
    // 先讀網址參數設好篩選，initMap 的第一次框選才會直接對焦到指定店家
    const urlStore = readStoreUrlParam();
    renderStores();

    try {
      initMap();
    } catch (error) {
      showMapFallback();
    }

    if (urlStore) {
      revealActiveFilter('[data-category]');
      focusStore(urlStore.id);
    }

    /* iOS Safari 按「上一頁」回來走 bfcache，script 不會重跑。
     * 使用者在清單頁勾了幾項再回地圖，「還沒買 N 項」必須跟著更新。 */
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) renderStores();
    });
  </script>
</body>
</html>
