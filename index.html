<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>北九州之旅購物清單</title>
<link rel="stylesheet" href="assets/kij.css">
</head>
<body class="kij">
<div id="app">
  <header class="kij-header">
    <div class="kij-shell">
      <div class="title-row">
        <b>北九州購物清單</b>
        <span id="kijItemCount"></span>
      </div>
      <div class="kij-progress">
        <div class="kij-progress-head">
          <span class="label" id="kijProgressLabel"></span>
          <span class="kij-progress-sum" id="kijProgressSum"></span>
        </div>
        <div class="kij-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="購物完成進度">
          <div class="kij-progress-fill" id="kijProgressFill"></div>
        </div>
        <p class="kij-progress-note" id="kijProgressNote"></p>
      </div>
      <nav class="kij-tabs" id="kijTabs">
        <button type="button" class="kij-tab active" data-action="tab" data-group="shopping">藥妝日用</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="convenience">便利商店必買必吃</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="dryer">吹風機</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="shoes">鞋款</button>
      </nav>
    </div>
  </header>

  <main id="kijMain">
    <div id="kijSections"></div>
  </main>

  <nav class="kij-bottombar">
    <a href="#" class="active" data-action="nav-list"><i>🛍️</i>清單</a>
    <a href="map.html"><i>🗺️</i>地圖</a>
  </nav>
</div>

<script type="module">
import { PRODUCTS } from './assets/products.js';

/* ────────────────────────────────────────────────────────────────
 * 資料索引
 * ──────────────────────────────────────────────────────────────── */
const PRODUCTS_BY_ID = new Map(PRODUCTS.map((p) => [p.id, p]));
const GROUPS = ['shopping', 'convenience', 'dryer', 'shoes'];
const GROUP_META = {
  shopping: { label: '藥妝日用', icon: '🛍️' },
  convenience: { label: '便利商店必買必吃', icon: '🏪' },
  dryer: { label: '吹風機', icon: '💨' },
  shoes: { label: '鞋款試穿', icon: '👟' },
};
let activeGroup = 'shopping';

/* 6 種實際 category → 4 種色票 class 的對應規則。
 * 分類文字本身一律從 PRODUCTS 動態取得（不寫死清單），
 * 這裡只是「文字 → 色票」的樣式對照表，找不到對應時 fallback 到 kij-cat-shoe（中性藍）。 */
const CATEGORY_CHIP_CLASS = {
  '皮膚護理': 'kij-cat-drug',
  '痠痛舒緩': 'kij-cat-drug',
  '旅途常備藥': 'kij-cat-drug',
  '食品伴手禮': 'kij-cat-food',
  '3C 配件': 'kij-cat-electronics',
  '日用品': 'kij-cat-shoe',
  '晴雨傘': 'kij-cat-shoe',
  '冰品': 'kij-cat-food',
  '麵包甜點': 'kij-cat-food',
  '飲品': 'kij-cat-food',
  '即食湯品': 'kij-cat-food',
  '廚房用品': 'kij-cat-food',
  '戶外用品': 'kij-cat-shoe',
};
function chipClassForCategory(category) {
  return CATEGORY_CHIP_CLASS[category] || 'kij-cat-shoe';
}

/* ────────────────────────────────────────────────────────────────
 * localStorage 存取（讀不到一律回傳預設值，絕不拋錯中斷頁面）
 * ──────────────────────────────────────────────────────────────── */
function readBool(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v === null) return fallback;
    return v === '1' || v === 'true';
  } catch (err) {
    return fallback;
  }
}

function writeBool(key, val) {
  try {
    localStorage.setItem(key, val ? '1' : '0');
  } catch (err) {
    /* 無痕模式或儲存空間不可用時，忽略寫入，不影響畫面操作 */
  }
}

function readNum(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    if (v === null || v === '') return fallback;
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  } catch (err) {
    return fallback;
  }
}

function writeNum(key, val) {
  try {
    localStorage.setItem(key, String(val));
  } catch (err) {
    /* 同上，忽略寫入失敗 */
  }
}

/* ────────────────────────────────────────────────────────────────
 * 狀態存取
 * ──────────────────────────────────────────────────────────────── */
function isBought(id) { return readBool(`kij_bought_${id}`, false); }
function setBought(id, val) { writeBool(`kij_bought_${id}`, val); }

function isTried(id) { return readBool(`kij_tried_${id}`, false); }
function setTried(id, val) { writeBool(`kij_tried_${id}`, val); }

function getQty(id) {
  const product = PRODUCTS_BY_ID.get(id);
  const fallback = product && product.defaultQty != null ? product.defaultQty : 1;
  return readNum(`kij_qty_${id}`, fallback);
}
function setQty(id, val) { writeNum(`kij_qty_${id}`, Math.max(0, val)); }

function isSectionCollapsed(group) { return readBool(`kij_section_${group}_collapsed`, false); }
function setSectionCollapsed(group, val) { writeBool(`kij_section_${group}_collapsed`, val); }

/* ────────────────────────────────────────────────────────────────
 * 小工具
 * ──────────────────────────────────────────────────────────────── */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function makeFallback(letter) {
  const div = document.createElement('div');
  div.className = 'kij-img-fallback';
  div.textContent = letter;
  return div;
}

/* 分類／群組色票 pill：shopping 群組用 6 種 category 對照 4 色，
 * dryer／shoes 群組沒有 category，改用「這個群組本身」對應最貼近的色票，
 * 讓吹風機（家電）落在 kij-cat-electronics、鞋款落在 kij-cat-shoe，維持一致規則。 */
function pillForProduct(product) {
  if (product.group === 'convenience' && product.storeBrand) {
    return { text: product.storeBrand, cls: 'kij-cat-food' };
  }
  if (product.group === 'shopping' && product.category) {
    return { text: product.category, cls: chipClassForCategory(product.category) };
  }
  if (product.group === 'dryer') {
    return { text: 'Panasonic', cls: 'kij-cat-electronics' };
  }
  if (product.group === 'shoes') {
    return { text: SHOE_BRANDS[product.id] || '鞋款', cls: 'kij-cat-shoe' };
  }
  return null;
}

const PRICE_KIND_LABEL = {
  official: '官方定價',
  'retailer-reference': '通路參考價',
  'launch-reference': '上市參考價',
  'photo-reference': '照片標價',
  pending: '價格待確認',
};

const STORE_SUMMARIES = {
  '3coins-plus-amu-plaza-kokura': { type: '生活雜貨（3COINS／DAISO）', name: '3COINS+plus AMU PLAZA 小倉店' },
  '3coins-plus-mina-tenjin': { type: '生活雜貨（3COINS／DAISO）', name: '3COINS+plus ミーナ天神店' },
  'biccamera-tenjin-2': { type: '家電', name: 'BicCamera 天神 2 號館' },
  'daiso-amu-plaza-kokura': { type: '生活雜貨', name: 'DAISO AMU PLAZA 小倉店' },
  'daiso-hakata-bus-terminal': { type: '生活雜貨', name: 'DAISO 博多巴士總站店' },
  'daikoku-drug-tenjin-building': { type: '藥妝', name: '大國藥妝天神大樓店' },
  'don-quijote-nakasu': { type: '藥妝', name: '唐吉訶德中洲店' },
  'hoka-fukuoka-tenjin': { type: '鞋店', name: 'HOKA Fukuoka Tenjin' },
  'hands-hakata': { type: '生活雜貨', name: 'HANDS 博多店' },
  'kayanoya-hakata-station-daitos': { type: '食品／伴手禮', name: '茅乃舍 博多站 DEITOS 店' },
  'kayanoya-kokura-izutsuya': { type: '食品／伴手禮', name: '茅乃舍 小倉井筒屋店' },
  'matsumoto-kiyoshi-hakata-station-underground': { type: '藥妝', name: '松本清博多站地下街店' },
  'maxvalu-express-hakata-gion': { type: '超市／賣場', name: 'MaxValu Express 博多祇園店' },
  'murasaki-sports-canal-city-hakata': { type: '鞋店', name: 'ムラサキスポーツキャナルシティ博多店' },
  'sports-depo-canal-city-hakata': { type: '鞋店', name: 'SPORTS DEPO キャナルシティ博多店' },
};

const DRYER_SUMMARIES = {
  ne7n: 'W 礦物＋負離子・可折疊',
  ne5n: '負離子・可折疊',
};

const SHOE_BRANDS = {
  cloudtilt: 'ON', cloudsurfermax: 'ON', cloudsurfer2: 'ON', cloud6: 'ON', cloudrunner3: 'ON',
  clifton11: 'HOKA', bondi9: 'HOKA', skyflow: 'HOKA', transport2: 'HOKA', gaviota5: 'HOKA',
};

const DRYER_COMPARISON_ROWS = {
  ne7n: ['EH-NE7N', '1.6 m³/min', '3.3 m³/min（Panasonic 自家基準）', 'TURBO 90°C／CARE 65°C／COLD', 'W Mineral＋負離子、離子充電面板', '約 550 g・可折疊', 'AC 100 V・1200 W'],
  ne5n: ['EH-NE5N', '1.6 m³/min', '3.0 m³/min（Panasonic 自家基準）', 'TURBO 90°C／CARE／COLD', '外置負離子', '約 545 g・可折疊', 'AC 100 V・1200 W'],
};

const SHOE_COMPARISON_ROWS = {
  cloudtilt: ['On', '¥23,100', '城市步行、日常穿搭', '前掌空間與長時間步行穩定感'],
  cloudsurfermax: ['On', '¥23,100', '厚緩震跑步／長距離步行', '足弓、後跟鎖定與厚底穩定性'],
  cloudsurfer2: ['On', '¥20,900', '日常跑步與步行', '中底回彈、鞋面包覆與轉彎感'],
  cloud6: ['On', '¥19,800', '通勤、日常穿搭', '腳背高度與鞋帶包覆'],
  cloudrunner3: ['On', '¥18,700', '需要支撐的走跑', '內側支撐是否自然、標準與寬楦'],
  clifton11: ['HOKA', '¥19,800', '日常跑步與長時間步行', '鞋楦、後跟與中足支撐'],
  bondi9: ['HOKA', '¥24,200', '最大緩震、長時間站走', '厚底下轉彎時的穩定性'],
  skyflow: ['HOKA', '¥22,000', '平順步行／跑步', '前掌彎折、後跟固定'],
  transport2: ['HOKA', '¥22,000', '旅遊通勤、城市步行', '鞋底抓地與鞋面耐候需求'],
  gaviota5: ['HOKA', '¥27,500', '穩定支撐、足弓需求較高', '內側支撐不會頂腳'],
};

function tableHtml(headings, rows) {
  return `<div class="kij-compare-scroll"><table><thead><tr>${headings.map((heading) => `<th>${escapeHtml(heading)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((value) => `<td>${escapeHtml(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function comparisonTableHtml(group, items) {
  if (group === 'dryer') {
    const [ne7n, ne5n] = items.map((product) => DRYER_COMPARISON_ROWS[product.id]);
    const rowLabels = ['JIS 風量', '髮絲受風量', '模式', '離子／礦物', '重量／收納', '電壓／功率'];
    const rows = rowLabels.map((label, index) => [label, ne7n[index + 1], ne5n[index + 1]]);
    return `<section class="kij-compare kij-dryer-compare" aria-label="吹風機完整比較表">
      <p class="kij-compare-note"><strong>電壓提醒：</strong>兩款皆為 AC 100 V，不可因插頭相同就視為可直插台灣 110 V。</p>
      ${tableHtml(['項目', ne7n[0], ne5n[0]], rows)}
    </section>`;
  }
  const onRows = items.filter((product) => SHOE_COMPARISON_ROWS[product.id]?.[0] === 'On').map((product) => [product.name, ...SHOE_COMPARISON_ROWS[product.id].slice(1)]);
  const hokaRows = items.filter((product) => SHOE_COMPARISON_ROWS[product.id]?.[0] === 'HOKA').map((product) => [product.name, ...SHOE_COMPARISON_ROWS[product.id].slice(1)]);
  const headings = ['鞋款', '日本參考價', '官方定位', '試穿時確認重點'];
  return `<section class="kij-compare kij-shoe-compare" aria-label="鞋款完整比較表">
    <p class="kij-compare-note">鞋楦、腳型與腳感因人而異；穿著旅行豆子同時試左右腳，走直線與轉彎各至少一分鐘。</p>
    <section class="kij-shoe-brand kij-shoe-brand-on" aria-label="ON 鞋款">
      <h3 class="kij-compare-title">ON <span>城市步行與輕量緩震</span></h3>${tableHtml(headings, onRows)}
    </section>
    <section class="kij-shoe-brand kij-shoe-brand-hoka" aria-label="HOKA 鞋款">
      <h3 class="kij-compare-title">HOKA <span>厚底緩震與穩定支撐</span></h3>${tableHtml(headings, hokaRows)}
    </section>
  </section>`;
}

function recommendedStoreText(product) {
  if (product.group !== 'shopping') return null;
  const stores = product.stores.map((id) => STORE_SUMMARIES[id]).filter(Boolean);
  if (stores.length === 0) return null;
  return stores.map((store) => store.name).join('／');
}

/* 勾選框樣式的狀態按鈕：方框由 CSS 畫，切換時只改 class，
   不重寫按鈕內容，避免把方框元素洗掉。 */
function purchaseToggleHtml(product) {
  const bought = isBought(product.id);
  return `<button type="button" class="kij-status-btn${bought ? ' on' : ''}" data-action="toggle-bought" aria-pressed="${bought}"><span class="kij-check" aria-hidden="true"></span>已購買</button>`;
}

function triedToggleHtml(product) {
  const tried = isTried(product.id);
  return `<button type="button" class="kij-status-btn${tried ? ' on' : ''}" data-action="toggle-tried" aria-pressed="${tried}"><span class="kij-check" aria-hidden="true"></span>已試穿</button>`;
}

// 小計＝參考單價×購買數量，讓「買 3 條要多少錢」不用自己心算
function subtotalText(product, qty) {
  if (product.yen == null) return '';
  return `小計 ¥${(product.yen * qty).toLocaleString()}`;
}

function subtotalHtml(product, qty) {
  const text = subtotalText(product, qty);
  return text ? `<span class="kij-qty-sum">${text}</span>` : '';
}

/* ────────────────────────────────────────────────────────────────
 * 卡片渲染
 * ──────────────────────────────────────────────────────────────── */
function buildCardHtml(product) {
  const pill = pillForProduct(product);
  const pillHtml = pill ? `<span class="kij-pill ${pill.cls}">${escapeHtml(pill.text)}</span>` : '';
  const jaHtml = product.jaName ? `<div class="ja">${escapeHtml(product.jaName)}</div>` : '';
  const modelHtml = product.model && product.group !== 'dryer' ? `<div class="ja">型號：${escapeHtml(product.model)}</div>` : '';
  const fullImage = product.image.replace('/thumb/', '/full/');
  const storeText = recommendedStoreText(product);
  const dryerSummaryHtml = product.group === 'dryer' ? `<div class="kij-dryer-summary">${escapeHtml(DRYER_SUMMARIES[product.id] || '')}</div>` : '';

  let priceHtml = '';
  let controlsHtml = '';
  const priceKindText = PRICE_KIND_LABEL[product.priceKind] || '參考價';

  if (product.group === 'convenience') {
    priceHtml = '';
    controlsHtml = purchaseToggleHtml(product);
  } else if (product.group === 'dryer') {
    const yenText = product.yen != null ? `¥${product.yen.toLocaleString()}` : '價格待確認';
    priceHtml = `<div class="price-row"><span class="yen">${yenText}</span><span class="kij-price-kind">通路參考價</span></div>`;
    controlsHtml = purchaseToggleHtml(product);
  } else if (product.tracking === 'buy') {
    const qty = getQty(product.id);
    const yenText = product.yen != null ? `¥${product.yen.toLocaleString()}` : '價格待確認';
    const twdText = product.twdRef != null ? `（約 NT$${product.twdRef.toLocaleString()}）` : '';
    priceHtml = product.group === 'shopping'
      ? `<dl class="kij-shopping-details">
          <dt>購買數量</dt><dd><span class="kij-qty-control"><button type="button" class="kij-qty-btn" data-action="qty-minus" aria-label="減少數量">－</button><span class="kij-qty-value" aria-live="polite">${qty}</span><button type="button" class="kij-qty-btn" data-action="qty-plus" aria-label="增加數量">＋</button></span>${subtotalHtml(product, qty)}</dd>
          <dt>參考價格</dt><dd class="price">約 ${yenText} ${twdText}</dd>
          ${storeText ? `<dt>推薦店家</dt><dd>${escapeHtml(storeText)}</dd>` : ''}
        </dl>`
      : `<div class="price-row"><span class="yen">${yenText}</span><span class="twd">${twdText}</span><span class="kij-price-kind">${priceKindText}</span></div>`;
    controlsHtml = purchaseToggleHtml(product);
  } else {
    const yenText = product.yen != null ? `¥${product.yen.toLocaleString()}` : '價格待確認';
    priceHtml = `
      <div class="price-row">
        <span class="yen">${yenText}</span>
        <span class="kij-price-kind">${priceKindText}</span>
      </div>`;
    controlsHtml = triedToggleHtml(product);
  }

  // 商品頁連結：行前比價時直接開來源頁確認規格與現價，站內不重複維護這些內容
  const sourceLinkHtml = product.priceSourceUrl
    ? `<a class="kij-source-link" href="${escapeHtml(product.priceSourceUrl)}" target="_blank" rel="noopener noreferrer">商品頁<span aria-hidden="true"> ↗</span></a>`
    : '';

  return `
    <div class="kij-card kij-card-${escapeHtml(product.group)}${product.tracking === 'buy' && isBought(product.id) ? ' is-bought' : ''}" id="${escapeHtml(product.id)}" data-id="${escapeHtml(product.id)}">
      <div class="thumb">
        <a class="kij-image-link" href="${escapeHtml(fullImage)}" target="_blank" rel="noopener noreferrer" aria-label="放大查看 ${escapeHtml(product.name)} 圖片"><img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}" loading="lazy"></a>
      </div>
      <div class="kij-card-head">
        ${pillHtml || '<span></span>'}
        ${controlsHtml}
      </div>
      <div class="mid">
        <h5>${escapeHtml(product.name)}</h5>
        ${jaHtml}
        ${modelHtml}
        ${dryerSummaryHtml}
      </div>
      <div class="kij-card-detail">
        ${priceHtml}
        ${sourceLinkHtml}
      </div>
    </div>`;
}

function shoeCountText() {
  const shoeItems = PRODUCTS.filter((p) => p.group === 'shoes');
  const triedCount = shoeItems.filter((p) => isTried(p.id)).length;
  return `已試穿 ${triedCount} / ${shoeItems.length}`;
}

function buildSectionHtml(group) {
  const meta = GROUP_META[group];
  const items = PRODUCTS.filter((p) => p.group === group);
  const collapsed = isSectionCollapsed(group);
  let bodyInner;

  if (group === 'shopping') {
    // 分類清單只從實際出現在 PRODUCTS 裡的 category 動態推算，不寫死清單。
    const categories = [...new Set(items.map((p) => p.category))];
    bodyInner = categories.map((category) => {
      const catItems = items.filter((p) => p.category === category);
      const chipCls = chipClassForCategory(category);
      return `
        <div class="kij-subcat" data-category="${escapeHtml(category)}">
          <div class="kij-subcat-heading" style="padding:6px 4px;">
            <span class="kij-pill ${chipCls}">${escapeHtml(category)}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:6px;">${catItems.length} 項</span>
          </div>
          ${catItems.map(buildCardHtml).join('')}
        </div>`;
    }).join('');
  } else if (group === 'shoes') {
    bodyInner = ['ON', 'HOKA'].map((brand) => {
      const brandItems = items.filter((product) => SHOE_BRANDS[product.id] === brand);
      return `<div class="kij-shoe-card-group kij-shoe-card-group-${brand.toLowerCase()}">
        <h3>${brand}</h3>
        <div class="kij-shoe-card-grid">${brandItems.map(buildCardHtml).join('')}</div>
      </div>`;
    }).join('');
  } else {
    bodyInner = items.map(buildCardHtml).join('');
  }

  if (group === 'dryer' || group === 'shoes') bodyInner = comparisonTableHtml(group, items) + bodyInner;

  const countText = group === 'shoes' ? shoeCountText() : `${items.length} 項`;

  return `
    <section class="kij-section" data-group="${group}">
      <div class="kij-section-header" data-action="toggle-section" role="button" tabindex="0" aria-expanded="${!collapsed}">
        <b>${meta.icon} ${meta.label}</b>
        <span class="count">${countText}</span>
      </div>
      <div class="kij-section-body"${collapsed ? ' hidden' : ''}>
        ${bodyInner}
      </div>
    </section>`;
}

function attachImageFallbacks() {
  document.querySelectorAll('#kijSections .kij-card .thumb img').forEach((img) => {
    const card = img.closest('[data-id]');
    const product = PRODUCTS_BY_ID.get(card.dataset.id);
    img.addEventListener('error', () => {
      img.replaceWith(makeFallback(product.name[0]));
    }, { once: true });
  });
}

function renderSections() {
  document.getElementById('kijSections').innerHTML = buildSectionHtml(activeGroup);
  attachImageFallbacks();
}

/* ────────────────────────────────────────────────────────────────
 * 局部更新（狀態變動後只補該卡片／該區塊，不整頁重繪，避免打斷目前的頁籤篩選視圖）
 * ──────────────────────────────────────────────────────────────── */
function syncCardVisual(card, product) {
  if (product.tracking === 'buy') {
    const boughtBtn = card.querySelector('[data-action="toggle-bought"]');
    const bought = isBought(product.id);
    if (boughtBtn) {
      boughtBtn.classList.toggle('on', bought);
      boughtBtn.setAttribute('aria-pressed', String(bought));
    }
    // 整張卡片反映已購買狀態，讓使用者在店裡一眼掃出還沒買的品項
    card.classList.toggle('is-bought', bought);

    const qty = getQty(product.id);
    const qtyValueEl = card.querySelector('.kij-qty-value');
    if (qtyValueEl) qtyValueEl.textContent = String(qty);
    const qtySumEl = card.querySelector('.kij-qty-sum');
    if (qtySumEl) qtySumEl.textContent = subtotalText(product, qty);
  } else {
    const triedBtn = card.querySelector('[data-action="toggle-tried"]');
    const tried = isTried(product.id);
    triedBtn.classList.toggle('on', tried);
    triedBtn.setAttribute('aria-pressed', String(tried));
  }
}

function updateProgressBar() {
  const buyItems = PRODUCTS.filter((p) => p.tracking === 'buy');
  const boughtCount = buyItems.filter((p) => isBought(p.id)).length;
  const percent = buyItems.length === 0 ? 0 : Math.round((boughtCount / buyItems.length) * 100);

  document.getElementById('kijProgressLabel').textContent = `已買 ${boughtCount} / ${buyItems.length} 項`;

  const fill = document.getElementById('kijProgressFill');
  fill.style.width = `${percent}%`;
  const track = fill.parentElement;
  track.setAttribute('aria-valuenow', String(percent));
  track.setAttribute('aria-valuetext', `已買 ${boughtCount} 項，共 ${buyItems.length} 項，完成 ${percent}%`);

  // 尚未購買的預估金額：行前比價與抓預算用，已買的不再計入
  const remaining = buyItems.filter((p) => !isBought(p.id));
  const yenSum = remaining.reduce((sum, p) => sum + (p.yen != null ? p.yen * getQty(p.id) : 0), 0);
  const twdSum = remaining.reduce((sum, p) => sum + (p.twdRef != null ? p.twdRef * getQty(p.id) : 0), 0);
  const missingPrice = remaining.filter((p) => p.yen == null).length;
  document.getElementById('kijProgressSum').textContent = boughtCount === buyItems.length
    ? '全部買齊了'
    : `待買約 ¥${yenSum.toLocaleString()}（約 NT$${twdSum.toLocaleString()}）`;

  const refCount = PRODUCTS.length - buyItems.length;
  const notes = refCount > 0 ? [`另 ${refCount} 項為比較參考，不計入進度`] : [];
  if (missingPrice > 0) notes.push(`${missingPrice} 項價格待確認`);
  document.getElementById('kijProgressNote').textContent = notes.join('・');
}

function updateShoeSectionCount() {
  const header = document.querySelector('.kij-section[data-group="shoes"] .kij-section-header .count');
  if (header) header.textContent = shoeCountText();
}

function syncKijState() {
  window.__kijState = {
    bought: Object.fromEntries(PRODUCTS.filter((p) => p.tracking === 'buy').map((p) => [p.id, isBought(p.id)])),
    qty: Object.fromEntries(PRODUCTS.filter((p) => p.tracking === 'buy').map((p) => [p.id, getQty(p.id)])),
    tried: Object.fromEntries(PRODUCTS.filter((p) => p.tracking === 'try').map((p) => [p.id, isTried(p.id)])),
  };
}

/* ────────────────────────────────────────────────────────────────
 * 分類頁籤「跳轉＋聚焦」（brief 給定的確切邏輯）
 * ──────────────────────────────────────────────────────────────── */
function focusSection(group) {
  activeGroup = group;
  document.querySelectorAll('.kij-tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.group === group));
  renderSections();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* map.html 商品縮圖連到 index.html#<id> 時，載入應能展開該商品所屬分區並捲動聚焦；
 * 沿用 focusSection 的展開邏輯，但只展開單一分區、不影響其他分區的顯示／收合狀態。 */
function focusProductById(id) {
  const product = PRODUCTS_BY_ID.get(id);
  if (!product) return false;
  if (activeGroup !== product.group) focusSection(product.group);
  const card = document.getElementById(id);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return true;
  }
  return false;
}

/* 讀取 map.html 帶過來的商品錨點，展開對應分區並定位。 */
function applyUrlParams() {
  if (location.hash.length > 1) {
    const id = decodeURIComponent(location.hash.slice(1));
    focusProductById(id);
  }
}

function toggleSectionCollapse(section) {
  if (!section) return;
  const body = section.querySelector('.kij-section-body');
  const header = section.querySelector('.kij-section-header');
  if (!body || !header) return;
  const collapsedNext = !body.hidden;
  body.hidden = collapsedNext;
  header.setAttribute('aria-expanded', String(!collapsedNext));
  setSectionCollapsed(section.dataset.group, collapsedNext);
}

function resetView() {
  focusSection('shopping');
}

/* ────────────────────────────────────────────────────────────────
 * 事件委派
 * ──────────────────────────────────────────────────────────────── */
const appEl = document.getElementById('app');

appEl.addEventListener('click', (e) => {
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const card = actionEl.closest('.kij-card');
  const id = card?.dataset.id;
  const product = id ? PRODUCTS_BY_ID.get(id) : null;

  switch (action) {
    case 'tab': {
      e.preventDefault();
      document.querySelectorAll('.kij-tab').forEach((t) => t.classList.toggle('active', t === actionEl));
      focusSection(actionEl.dataset.group);
      break;
    }
    case 'toggle-section': {
      toggleSectionCollapse(actionEl.closest('.kij-section'));
      break;
    }
    case 'toggle-bought': {
      if (!product) return;
      setBought(id, !isBought(id));
      syncCardVisual(card, product);
      updateProgressBar();
      syncKijState();
      break;
    }
    case 'toggle-tried': {
      if (!product) return;
      setTried(id, !isTried(id));
      syncCardVisual(card, product);
      updateShoeSectionCount();
      syncKijState();
      break;
    }
    case 'qty-minus':
    case 'qty-plus': {
      if (!product) return;
      const delta = action === 'qty-plus' ? 1 : -1;
      setQty(id, Math.max(0, getQty(id) + delta));
      syncCardVisual(card, product);
      updateProgressBar();
      syncKijState();
      break;
    }
    case 'nav-list': {
      e.preventDefault();
      resetView();
      break;
    }
    default:
      break;
  }
});

appEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const header = e.target.closest('.kij-section-header');
  if (header) {
    e.preventDefault();
    toggleSectionCollapse(header.closest('.kij-section'));
  }
});

/* ────────────────────────────────────────────────────────────────
 * 初始化
 * ──────────────────────────────────────────────────────────────── */
document.getElementById('kijItemCount').textContent = `共 ${PRODUCTS.length} 項商品`;

/* 捲動後收合頁首，把螢幕還給商品。用 rAF 節流，避免捲動時反覆觸發版面計算。 */
(() => {
  const headerEl = document.querySelector('.kij-header');
  let ticking = false;
  const sync = () => {
    headerEl.classList.toggle('is-compact', window.scrollY > 72);
    ticking = false;
  };
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(sync);
  }, { passive: true });
  sync();
})();

renderSections();
updateProgressBar();
syncKijState();
applyUrlParams();
</script>
</body>
</html>
