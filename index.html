<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>北九州之旅購物清單</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2f6d5e">
<link rel="stylesheet" href="assets/kij.css">
</head>
<body class="kij">
<div id="app">
  <header class="kij-header">
    <div class="kij-shell">
      <div class="title-row">
        <b>北九州購物清單</b>
        <span id="kijItemCount"></span>
      </div>
      <p class="kij-status-line" id="kijStatusLine" aria-live="polite"></p>
      <div class="kij-toolbar">
        <div class="kij-search">
          <span class="kij-search-icon" aria-hidden="true">🔍</span>
          <input
            id="kijSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="搜尋商品、日文名或店家"
            aria-label="搜尋商品，可輸入中文品名、日文名、型號或店家名"
          >
          <button type="button" class="kij-search-clear" id="kijSearchClear" aria-label="清除搜尋" hidden>✕</button>
        </div>
        <button type="button" class="kij-filter-chip" id="kijUnboughtToggle" aria-pressed="false">只看未完成</button>
      </div>
      <nav class="kij-tabs" id="kijTabs">
        <button type="button" class="kij-tab active" data-action="tab" data-group="shopping" aria-current="true">藥妝日用</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="convenience">便利商店</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="powerbank">行動電源</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="dryer">吹風機</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="mouse">滑鼠</button>
        <button type="button" class="kij-tab" data-action="tab" data-group="shoes">鞋款</button>
      </nav>
    </div>
  </header>

  <main id="kijMain">
    <p class="kij-result-line" id="kijResultLine" role="status" aria-live="polite" hidden></p>
    <div id="kijSections"></div>
    <p class="kij-empty" id="kijEmpty" hidden></p>
  </main>

  <nav class="kij-bottombar" aria-label="主要導覽">
    <a href="index.html" class="active" aria-current="page" data-action="nav-list"><i>🛍️</i>清單</a>
    <a href="itinerary.html"><i>🗓️</i>行程</a>
    <a href="map.html"><i>🗺️</i>地圖</a>
  </nav>
</div>

<script type="module" src="scripts/index-app.js?v=20260901"></script>
</body>
</html>
